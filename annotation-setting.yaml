apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: annotation-setting-hao-post
spec:
  targetRef:
    group: content.halo.run
    kind: Post
  formSchema:
    - $formkit: "radio"
      name: "ai"
      label: "AI 摘要"
      help: "默认后台设置"
      options:
        - label: "启用"
          value: "true"
        - label: "禁用"
          value: "false"
    - $formkit: "radio"
      name: "copyrightEnable"
      id: "copyrightEnable"
      key: "copyrightEnable"
      label: "显示版权声明"
      help: "默认后台设置"
      options:
        - label: "显示"
          value: "true"
        - label: "隐藏"
          value: "false"
    - $formkit: "radio"
      name: "copyrightType"
      label: "版权声明类型"
      value: "original"
      if: "$get(copyrightEnable).value != 'false'"
      options:
        - label: "原创"
          value: "original"
        - label: "转载"
          value: "reprint"
    - $formkit: "text"
      name: "copyrightUrl"
      label: "版权声明链接"
      help: "默认后台设置"
      if: "$get(copyrightEnable).value != 'false'"
      placeholder: "请输入链接"

---

apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: annotation-setting-hao-menu
spec:
  targetRef:
    group: ""
    kind: MenuItem
  formSchema:
    - $formkit: "text"
      name: "icon"
      label: "图标"
      placeholder: "如 HomeOutlined、GithubOutlined、HeartTwoTone"
      help: "支持 @antdv-next/icons 全套图标名称（区分大小写）。图标预览：/themes/theme-hanlo/assets/icon/antdv-next/catalog.html"
    - $formkit: "radio"
      name: "submenuLayout"
      value: "inherit"
      label: "桌面子菜单布局"
      help: "跟随主题设置，或为此菜单单独选择布局。手机端使用折叠菜单。"
      options:
        - label: "跟随主题设置"
          value: "inherit"
        - label: "下拉"
          value: "dropdown"
        - label: "横向"
          value: "horizontal"
---

apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: annotation-setting-hao-link-group
spec:
  targetRef:
    group: core.halo.run
    kind: LinkGroup
  formSchema:
    - $formkit: "radio"
      name: "displayStyle"
      label: "分组方式"
      value: "default"
      options:
        - label: "默认"
          value: "default"
        - label: "美化"
          value: "beautify"
        - label: "失联"
          value: "deprecated"
    - $formkit: "textarea"
      name: "description"
      label: "描述"

---

apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: annotation-setting-hao-link
spec:
  targetRef:
    group: core.halo.run
    kind: Link
  formSchema:
    - $formkit: "attachment"
      name: "siteshot"
      label: "背景"
    - $formkit: "text"
      name: "label"
      label: "标签"
    - $formkit: "color"
      name: "labelColor"
      value: "#425AEF"
      label: "标签颜色"

---

apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: annotation-setting-hao-photo-group
spec:
  targetRef:
    group: core.halo.run
    kind: PhotoGroup
  formSchema:
    - $formkit: "attachment"
      name: "cover"
      label: "分组图片"
    - $formkit: "attachment"
      name: "background"
      label: "分组顶部 banner 图片"
    - $formkit: "textarea"
      name: "description"
      label: "分组描述"

