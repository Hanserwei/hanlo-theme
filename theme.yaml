apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-hanlo
spec:
  displayName: Hanlo Theme
  author:
    name: Hanserwei
  customTemplates:
    page:
      - name: 友情链接页面模版
        description: 支持可预设文本的友链
        screenshot:
        file: page_links.html
      - name: 关于页面模版
        description: 关于页面
        screenshot:
        file: about.html
      - name: 留言板页面模版
        description: 留言板页面
        screenshot:
        file: comments.html
      - name: 待办清单页面模版
        description: 待办清单页面
        screenshot:
        file: todolist.html
      - name: 相册页面模版
        description: 相册页面
        screenshot:
        file: album.html
      - name: 最近评论页面模版
        description: 最近评论页面
        screenshot:
        file: new_comment.html

  description: 适用于 Halo 2.x、基于 Thymeleaf 的响应式博客主题
  logo: /themes/theme-hanlo/assets/images/hanlo-logo.png
  settingName: "theme-hanlo-setting"
  configMapName: "theme-hanlo-configMap"
  version: "2.2.1"
  requires: ">=2.26.0"
