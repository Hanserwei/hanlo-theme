name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { parse } from "yaml";

          const version = parse(readFileSync("theme.yaml", "utf8")).spec.version;
          assert.ok(
            [version, `v${version}`].includes(process.env.RELEASE_TAG),
            `Release tag ${process.env.RELEASE_TAG} must match theme.yaml version ${version}.`
          );
          NODE
      - name: Check source
        run: pnpm check
      - name: Run unit and settings tests
        run: pnpm test
      - name: Build and package theme
        run: pnpm build
      - name: Verify committed build output
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- templates)" ]]; then
            git status --short -- templates
            echo "::error::Run pnpm build and commit the generated templates/ directory."
            exit 1
          fi
      - name: Verify ZIP archives
        run: |
          for archive in dist/*.zip; do
            unzip -t "$archive"
          done
      - name: Upload theme package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: theme-hanlo-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
