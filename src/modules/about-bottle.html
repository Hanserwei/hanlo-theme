<section class="about-bottle" data-about-bottle hidden aria-label="瓶中沧海 · 关于我"
         th:with="widgets = ${theme.config.about?.widget_list},
                  introEnabled = ${widgets != null and #lists.contains(widgets, 'content-idea')},
                  careersEnabled = ${widgets != null and #lists.contains(widgets, 'authorCareers')},
                  mottoEnabled = ${widgets != null and #lists.contains(widgets, 'textarea')},
                  interestsEnabled = ${widgets != null and #lists.contains(widgets, 'like-music')},
                  gameEnabled = ${widgets != null and #lists.contains(widgets, 'game')}">
    <div class="about-bottle__stage" data-bottle-stage></div>
    <header class="about-bottle__heading">
        <span class="about-bottle__eyebrow">A SMALL SEA, A LONG VOYAGE</span>
        <h1>瓶中沧海<span>关于我的一场微缩航行</span></h1>
        <p>把热爱装进一只瓶子，让好奇心带着它远航。</p>
    </header>
    <div class="about-bottle__status" data-bottle-status role="status" aria-live="polite">正在装入一片海…</div>
    <button class="about-bottle__retry" type="button" data-bottle-retry hidden>重试打开瓶中世界</button>
    <div class="about-bottle__controls" data-bottle-controls hidden aria-label="场景控制">
        <span class="about-bottle__period" data-bottle-period>黄昏</span>
        <button type="button" data-bottle-speed title="切换 ×1、×4、×12 和暂停">时间 · ×1</button>
        <button type="button" data-bottle-storm aria-pressed="false" title="按住按钮或在场景聚焦时按住空格">按住 · 风暴</button>
        <button type="button" data-bottle-reset>重置视角</button>
    </div>
    <aside class="about-bottle__panel" data-bottle-panel hidden aria-label="航海手记">
        <div class="about-bottle__panel-top"><span>航海手记</span><button type="button" data-bottle-close aria-label="收起手记">×</button></div>
        <div data-bottle-panel-content></div>
    </aside>
    <nav class="about-bottle__chapters" aria-label="探索关于我的故事">
        <button type="button" data-bottle-open="intro" aria-pressed="false"><span>01</span>瓶颈来信</button>
        <button type="button" data-bottle-open="voyage" aria-pressed="false"><span>02</span>航行履历</button>
        <button type="button" data-bottle-open="beacon" aria-pressed="false"><span>03</span>灯塔方向</button>
        <button type="button" data-bottle-open="treasure" aria-pressed="false"><span>04</span>海底珍藏</button>
        <button type="button" data-bottle-open="horizon" aria-pressed="false"><span>05</span>远方视野</button>
        <button type="button" data-bottle-open="journal" aria-pressed="false"><span>06</span>桌边手记</button>
    </nav>
    <p class="about-bottle__hint">拖动环视 · 滚轮 / 双指缩放 · 点击帆船、灯塔与陈设读手记 · 闲置后缓慢环航</p>

    <template data-bottle-chapter="intro">
        <span class="about-bottle__chapter-label">01 / MESSAGE IN A BOTTLE</span>
        <h2 th:text="${singlePage.spec.title}">关于我</h2>
        <div class="about-bottle__prose" th:if="${introEnabled}" th:utext="${theme.config.about?.content}"></div>
        <div class="about-bottle__tags">
            <span th:each="tag : ${theme.config.about?.author_info_left_tags}" th:text="${tag}"></span>
            <span th:each="tag : ${theme.config.about?.author_info_right_tags}" th:text="${tag}"></span>
        </div>
    </template>
    <template data-bottle-chapter="voyage">
        <span class="about-bottle__chapter-label">02 / THE VOYAGE SO FAR</span>
        <h2 th:text="${careersEnabled ? theme.config.about?.authorCareers?.authorCareersTitle ?: '一路航行' : '一路航行'}">一路航行</h2>
        <ol class="about-bottle__timeline" th:if="${careersEnabled}">
            <li th:each="career : ${theme.config.about?.authorCareers?.authorCareersTags}" th:text="${career.desc}"></li>
        </ol>
        <p>每一段经历，都是航线上的一个坐标。</p>
    </template>
    <template data-bottle-chapter="beacon">
        <span class="about-bottle__chapter-label">03 / A LIGHT TO STEER BY</span>
        <h2>心里的灯塔</h2>
        <div class="about-bottle__prose" th:if="${introEnabled}" th:utext="${theme.config.about?.idea}"></div>
        <blockquote th:if="${mottoEnabled}" th:each="motto : ${theme.config.about?.textarea}">
            <span th:text="${motto.textarea_up}"></span><br><span th:text="${motto.textarea_down}"></span>
        </blockquote>
    </template>
    <template data-bottle-chapter="treasure">
        <span class="about-bottle__chapter-label">04 / THINGS I TREASURE</span>
        <h2>珍藏的热爱</h2>
        <dl class="about-bottle__interests">
            <th:block th:if="${interestsEnabled and not #strings.isEmpty(theme.config.about?.like?.like_title)}"><dt>关注</dt><dd th:text="${theme.config.about.like.like_title}"></dd></th:block>
            <th:block th:if="${interestsEnabled and not #strings.isEmpty(theme.config.about?.music?.music_title)}"><dt>音乐</dt><dd th:text="${theme.config.about.music.music_title}"></dd></th:block>
            <th:block th:if="${gameEnabled and not #strings.isEmpty(theme.config.about?.game?.game_title)}"><dt>游戏与放松</dt><dd th:text="${theme.config.about.game.game_title}"></dd></th:block>
        </dl>
        <p th:if="${interestsEnabled}" th:text="${theme.config.about?.like?.like_bottom}"></p>
    </template>
    <template data-bottle-chapter="horizon">
        <span class="about-bottle__chapter-label">05 / BEYOND THE HORIZON</span>
        <h2>望向更远的地方</h2>
        <p>保留一点好奇心，继续学习，继续创造。</p>
        <div class="about-bottle__tags"><span th:each="tag : ${theme.config.about?.author_info_right_tags}" th:text="${tag}"></span></div>
        <th:block th:if="${theme.config.about?.tenyear?.tenyear_enable == true}">
            <h3 th:text="${theme.config.about.tenyear.tenyear_title}"></h3>
            <p th:text="${theme.config.about.tenyear.tenyear_content}"></p>
        </th:block>
        <p>完整的技能、个人资料与互动内容，可以在「文字关于」中查看。</p>
    </template>
    <template data-bottle-chapter="journal">
        <span class="about-bottle__chapter-label">06 / NOTES AT THE DESK</span>
        <h2>建站手记</h2>
        <div class="about-bottle__prose" th:utext="${theme.config.about?.xjlc}"></div>
    </template>
</section>
