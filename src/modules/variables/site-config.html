<!-- 声明一些公共信息 -->
<script id="site-config" th:inline="javascript"
        th:with="postAiEnabled=${htmlType == 'post' && (not #strings.isEmpty(#annotations.get(post, 'ai')) ? #annotations.get(post, 'ai') == 'true' : theme.config.post.aiDescription.aiDescriptionEnable)}">
    window.GLOBAL_CONFIG = {
        // 页面类型 index,page,post,tag,category
        htmlType: (/*[[${ htmlType }]]*/ null),
        postTitle: (/*[[${ htmlType == 'post' ? post.spec.title : htmlType == 'page' ? singlePage.spec.title : ''}]]*/ null),
        isPost: (/*[[${htmlType == 'post'}]]*/ null),
        isHome: (/*[[${ htmlType == 'index'}]]*/ null),
        copyright: undefined,
        lightbox: 'native',
        lazyload: {
            enable: (/*[[${theme.config.other.vanillaLazyload.enable}]]*/ null),
            error: (/*[[@{${theme.config.other.vanillaLazyload.errorImg}}]]*/ null)
        },
        isFriendLinksInFooter: (/*[[${theme.config.footer.footer_group.enable_footer_group}]]*/ null),
        loadingBox: (/*[[${theme.config.other.loadingBoxs.loadingBoxEnable}]]*/ null),
        helloText: (/*[[${#strings.listSplit(theme.config.sidebar.profile.helloText, ',')}]]*/ null),
        rightMenuEnable: (/*[[${theme.config.tool.rightMenu.rightMenuEnable}]]*/ null),
        colorScheme: (/*[[${theme.config.style.colorScheme}]]*/ null),
        effects: {
            bubble: (/*[[${theme.config.other.bubbleEnable}]]*/ null),
            universe: (/*[[${theme.config.style.universe}]]*/ null)
        },
        friends: {
            apiUrl: '/apis/api.friend.moony.la/v1alpha1/friendposts',
            pageSize: Number((/*[[${theme.config.link.fmomentsPageSize}]]*/ null)),
            errorImage: (/*[[@{${theme.config.other.error_404.background}}]]*/ null)
        },
        postAi: {
            summary: (/*[[${!postAiEnabled ? '' :
                        theme.config.post.aiDescription.mode != 'local' && !theme.config.post.aiDescription.switchBtn ? '' :
                        post.spec.excerpt.autoGenerate ? '本地模式需要自己填写文章摘要' :
                        #strings.isEmpty(post.status.excerpt) ? '请填写文章摘要' : post.status.excerpt}]]*/ null),
            randomRange: Number((/*[[${theme.config.post.aiDescription.randomNum}]]*/ null)),
            wordLimit: Number((/*[[${theme.config.post.aiDescription.basicWordCount}]]*/ null)),
            buttonLink: "[(${theme.config.post.aiDescription.btnLink})]",
            name: "[(${theme.config.post.aiDescription.gptName})]",
            mode: (/*[[${theme.config.post.aiDescription.mode}]]*/ null),
            switchable: (/*[[${theme.config.post.aiDescription.switchBtn}]]*/ null),
            key: "[(${theme.config.post.aiDescription.key})]",
            referer: "[(${theme.config.post.aiDescription.Referer})]"
        },
        widgets: {
            dynamicTitle: {
                enabled: Boolean((/*[[${theme.config.other.diytitle.diytitleEnable}]]*/ null)),
                leave: (/*[[${theme.config.other.diytitle.leaveTitle}]]*/ null) || '',
                back: (/*[[${theme.config.other.diytitle.backTitle}]]*/ null) || ''
            },
            greeting: {
                enabled: Boolean((/*[[${theme.config.other.greeting.enable_greeting}]]*/ null)),
                items: (/*[[${theme.config.other.greeting.setting}]]*/ null) || []
            },
            typed: {
                random: Boolean((/*[[${theme.config.top.above.enable_typed_random}]]*/ null)),
                items: (/*[[${theme.config.top.above.typed}]]*/ null) || []
            },
            tenYear: {
                startedAt: (/*[[${theme.config.about.tenyear.start_time}]]*/ null),
                endedAt: (/*[[${theme.config.about.tenyear.end_time}]]*/ null)
            },
            randomTagColors: (/*[[${theme.config.other.tagRandomColorEnable}]]*/ null)
        },
        date_suffix: {
            just: '刚刚',
            min: '分钟前',
            hour: '小时前',
            day: '天前',
            month: '个月前'
        },
        Snackbar: {
            chs_to_cht: "你已切换为繁体",
            cht_to_chs: "你已切换为简体",
            day_to_night: "你已切换为深色模式",
            night_to_day: "你已切换为浅色模式",
            bgLight: "[(${theme.config.style.themeLightSkin})]",
            bgDark: "[(${theme.config.style.themeDarkSkin})]",
            position: "top-center",
        },
        translate: {
            defaultEncoding: (/*[[${theme.config.style.translate.defaultEncoding}]]*/ null),
            translateDelay: 0,
            msgToTraditionalChinese: "繁",
            msgToSimplifiedChinese: "简",
            rightMenuMsgToTraditionalChinese: "轉為繁體",
            rightMenuMsgToSimplifiedChinese: "转为简体"
        },
        shiki: {
            enable: (/*[[${theme.config.code.shiki_enable == null || theme.config.code.shiki_enable}]]*/ null),
            enable_title: (/*[[${ theme.config.code.enable_title }]]*/ null),
            enable_hr: (/*[[${ theme.config.code.enable_hr }]]*/ null),
            enable_line: (/*[[${ theme.config.code.enable_line }]]*/ null),
            enable_copy: (/*[[${ theme.config.code.enable_copy }]]*/ null),
            enable_expander: (/*[[${ theme.config.code.enable_expander }]]*/ null),
            height_limit: Number((/*[[${#strings.isEmpty(theme.config.code.height_limit) ? 300 : theme.config.code.height_limit}]]*/ null)),
            enable_height_limit: (/*[[${theme.config.code.enable_height_limit}]]*/ null),
            theme_light: "[(${theme.config.code.theme_light})]",
            theme_dark: "[(${theme.config.code.theme_dark})]"
        },
        source: {
            links: {
                linksUrl: (/*[[${ theme.config.link.linksUrl }]]*/ null),
                linksNum: (/*[[${theme.config.footer.footer_group.num}]]*/ null),
            },
            post: {
                dynamicBackground: (/*[[${ theme.config.post.dynamicBackground }]]*/ null)
            },
            tool: {
                switch: (/*[[${ theme.config.tool.snackbar.switch }]]*/ null)
            },
            postAi: {
                ai: (/*[[${!postAiEnabled ? '' :
                                    theme.config.post.aiDescription.mode != 'local' && !theme.config.post.aiDescription.switchBtn ? '' :
                                    post.spec.excerpt.autoGenerate ? '本地模式需要自己填写文章摘要' :
                                    #strings.isEmpty(post.status.excerpt) ? '请填写文章摘要' : post.status.excerpt  }]]*/ null),
                randomNum: (/*[[${theme.config.post.aiDescription.randomNum}]]*/ null),
                basicWordCount: (/*[[${theme.config.post.aiDescription.basicWordCount}]]*/ null),
                btnLink: "[(${theme.config.post.aiDescription.btnLink})]",
                gptName: "[(${theme.config.post.aiDescription.gptName})]",
                modeName: (/*[[${theme.config.post.aiDescription.mode}]]*/ null),
                switchBtn: (/*[[${theme.config.post.aiDescription.switchBtn}]]*/ null),
                keys: "[(${theme.config.post.aiDescription.key})]",
                Referers: "[(${theme.config.post.aiDescription.Referer})]",
            },
            img: {
                src: (/*[[${isLazyload ? 'data-lazy-src' : 'src' }]]*/ null)
            },
            footer: {
                default_enable: (/*[[${theme.config.footer.footerContent.default_enable_group.default_enable}]]*/ null)
            }
        }
    };

</script>
