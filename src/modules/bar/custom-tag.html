<!-- 目录条，这里使用和 category-bar 同样的 css -->
<div id="category-bar">
    <div class="category-bar-items" id="category-bar-items">
        <div class="category-bar-item select" id="category-bar-home">
            <a href="/">首页</a>
        </div>

        <th:block th:each="navTag : ${theme.config.layout.navs.navTag}"
                  th:if="${not #strings.isEmpty(navTag)}"
                  th:with="tagItem=${tagFinder.getByName(navTag)}">
            <div class="category-bar-item" th:if="${tagItem != null}">
                <a th:href="@{${tagItem.status.permalink}}" th:text="${tagItem.spec.displayName}"></a>
            </div>
        </th:block>

    </div>
    <th:block th:replace="~{modules/bar/more}" />
</div>
