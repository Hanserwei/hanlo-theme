<!-- 目录条 -->
<div id="category-bar">
    <div class="category-bar-items" id="category-bar-items">
        <div class="category-bar-item select" id="category-bar-home">
            <a href="/">首页</a>
        </div>

        <th:block th:each="navCategory : ${theme.config.layout.navs.navCategory}"
                  th:if="${not #strings.isEmpty(navCategory)}"
                  th:with="categoryItem=${categoryFinder.getByName(navCategory)}">
            <div class="category-bar-item" th:if="${categoryItem != null}">
                <a th:href="@{${categoryItem.status.permalink}}" th:text="${categoryItem.spec.displayName}"></a>
            </div>
        </th:block>

    </div>
    <th:block th:replace="~{modules/bar/more}" />
</div>
