
<!-- 阅读建议 -->
<th:block th:if="${not #lists.isEmpty(post.categories)}">
    <th:block th:with="recommendQuantity=${theme.config.post.recommendQuantity},
                       recommandPosts=${postFinder.listByCategory(1, recommendQuantity == 'six' ? 7 : recommendQuantity == 'two' ? 3 : 1, post.categories.get(0).metadata.name)},
                       postRandomImg=${#strings.contains(postRandomImgSource,'?') ? postRandomImgSource+'&amp;' : postRandomImgSource+'?'}">
        <th:block th:with="relatedPosts=${recommandPosts.items.?[metadata.name != #ctx.getVariable('post').metadata.name]}">
            <link th:if="${not #lists.isEmpty(relatedPosts) and recommendQuantity == 'six'}" rel="stylesheet"
                  th:href="${assets_link + '/css/related-posts-six-' + theme.spec.version + '.css' + theme_version}">
            <link th:if="${not #lists.isEmpty(relatedPosts) and recommendQuantity == 'two'}" rel="stylesheet"
                  th:href="${assets_link + '/css/related-posts-two-' + theme.spec.version + '.css' + theme_version}">
            <div class="relatedPosts" th:if="${not #lists.isEmpty(relatedPosts) and (recommendQuantity == 'six' or recommendQuantity == 'two')}">
                <div class="headline">
                    <i class="haofont hao-icon-cainixihuan hl:[font-size:1.1rem]"></i>
                    <span>阅读建议</span>
                </div>
                <div class="relatedPosts-list">
                    <th:block th:each="recommandPost,iterStat : ${relatedPosts}">
                        <div th:if="${iterStat.index < (recommendQuantity == 'six' ? 6 : 2)}">
                            <a th:href="@{${recommandPost.status.permalink}}" th:title="${recommandPost.spec.title}">
                                <img alt="cover" class="cover"
                                     th:with="img = ${#strings.isEmpty(recommandPost.spec.cover) ? postRandomImg+recommandPost.spec.title : thumbnail.gen(recommandPost.spec.cover, 'm')}"
                                     th:src="${isLazyload ? '' : img}"
                                     th:data-lazy-src="${isLazyload ? img : ''}">
                                <div class="content is-center">
                                    <div class="date" th:classappend="${recommendQuantity == 'six' ? 'hl:text-white' : ''}"><i class="far fa-calendar-alt fa-fw"></i>
                                        [[${#dates.format(recommandPost.spec.publishTime,'yyyy-MM-dd')}]]
                                    </div>
                                    <div class="title" th:classappend="${recommendQuantity == 'six' ? 'hl:text-white' : ''}" th:text="${recommandPost.spec.title}"></div>
                                </div>
                            </a>
                        </div>
                    </th:block>
                </div>
            </div>
        </th:block>
    </th:block>
</th:block>
