<!-- loading页面 -->
<th:block
          th:if="${theme.config.other.loadingBoxs.loadingBoxEnable} and not ${#strings.isEmpty(loadingBoxImage)}">
    <div class="hanlo-loading-box" data-hanlo-action="hide-loading" id="loading-box">
        <div class="loading-bg">
            <img alt="页面加载中" class="loading-img hl:rounded-full"
                 th:src="${loadingBoxImage}">
            <div class="loading-image-dot"></div>
        </div>
    </div>

</th:block>
