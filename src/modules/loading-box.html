<!-- loading页面 -->
<th:block
          th:if="${theme.config.other.loadingBoxs.loadingBoxEnable} and not ${#strings.isEmpty(loadingBoxImage)}">
    <div class="hanlo-loading-box" data-hanlo-action="hide-loading" id="loading-box">
        <div class="loading-bg">
            <div class="loading-content" role="status" aria-live="polite">
                <div class="loading-mark" aria-hidden="true">
                    <div class="loading-orbit"></div>
                    <div class="loading-avatar">
                        <img alt="" class="loading-img" th:src="${loadingBoxImage}" decoding="async">
                        <span class="loading-image-dot"></span>
                    </div>
                </div>
                <div class="loading-caption">
                    <span>正在加载</span>
                    <span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span>
                </div>
                <div class="loading-track" aria-hidden="true"></div>
            </div>
        </div>
    </div>
</th:block>
