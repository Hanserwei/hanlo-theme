<th:block th:fragment="nav-menu-recursion(menuItem)">
    <div th:if="${not #lists.isEmpty(menuItem.children)}" class="menus_item_child"
         th:id="${'submenu-' + menuItem.metadata.name}"
         th:with="itemLayout=${#annotations.getOrDefault(menuItem, 'submenuLayout', 'inherit')},
                  menuLayout=${itemLayout == 'horizontal' || itemLayout == 'dropdown' ? itemLayout : (theme.config.nav.menus.submenu_layout == 'horizontal' ? 'horizontal' : 'dropdown')}"
         th:data-submenu-layout="${menuLayout}">
        <div class="recursion_menus_item" th:each="childMenu : ${menuItem.children}">
            <a class="site-page child" th:target="${childMenu.spec.target?.value}"
               th:href="@{${childMenu.status.href}}">
                <th:block th:replace="~{modules/widgets/menu-icon :: menu-icon(icon=${#annotations.getOrDefault(childMenu, 'icon', '')})}"></th:block>
                <span th:text="${childMenu.status.displayName}"></span>
            </a>
            <button th:if="${not #lists.isEmpty(childMenu.children)}" class="hanlo-submenu-toggle hanlo-button-reset"
                    type="button" aria-expanded="false" th:aria-label="${'展开' + childMenu.status.displayName + '子菜单'}"
                    th:aria-controls="${'submenu-' + childMenu.metadata.name}">
                <th:block th:replace="~{modules/widgets/menu-icon :: menu-icon(icon='DownOutlined')}"></th:block>
            </button>
            <th:block th:replace="~{modules/widgets/nav-menu :: nav-menu-recursion(menuItem=${childMenu})}"></th:block>
        </div>
    </div>
</th:block>

<!-- The first level opens children; leaf items keep their configured links. -->
<div id="menus" class="hanlo-nav-menus" th:fragment="nav-menu">
    <div class="menus_items">
        <div class="menus_item" th:each="menuItem : ${menuFinder.getPrimary().menuItems}">
            <a class="site-page" th:if="${#lists.isEmpty(menuItem.children)}"
               th:target="${menuItem.spec.target?.value}" th:href="@{${menuItem.status.href}}">
                <th:block th:replace="~{modules/widgets/menu-icon :: menu-icon(icon=${#annotations.getOrDefault(menuItem, 'icon', '')})}"></th:block>
                <span th:text="${menuItem.status.displayName}"></span>
            </a>
            <button th:if="${not #lists.isEmpty(menuItem.children)}"
                    class="site-page hanlo-button-reset" type="button" aria-expanded="false"
                    th:aria-controls="${'submenu-' + menuItem.metadata.name}">
                <th:block th:replace="~{modules/widgets/menu-icon :: menu-icon(icon=${#annotations.getOrDefault(menuItem, 'icon', '')})}"></th:block>
                <span th:text="${menuItem.status.displayName}"></span>
            </button>
            <th:block th:replace="~{modules/widgets/nav-menu :: nav-menu-recursion(menuItem=${menuItem})}"></th:block>
        </div>
    </div>
</div>
