<!-- 居住地与个人信息：内容为空时不保留空卡片。 -->
<th:block th:with="location=${#strings.trim(theme.config.about.map.StrengthenTitle ?: '')},
                   lightMap=${#strings.trim(theme.config.about.map.background ?: '')},
                   darkMap=${#strings.trim(theme.config.about.map.backgroundDark ?: '')},
                   information=${theme.config.about.map.authorInfo}">
    <div class="author-content"
         th:if="${not #strings.isEmpty(location) or not #strings.isEmpty(lightMap) or not #strings.isEmpty(darkMap) or not #lists.isEmpty(information)}">
        <div class="author-content-item-group column mapAndInfo">
            <div class="author-content-item map single"
                 th:if="${not #strings.isEmpty(location) or not #strings.isEmpty(lightMap) or not #strings.isEmpty(darkMap)}"
                 th:with="lightBackground=${#strings.isEmpty(lightMap) ? darkMap : lightMap},
                          darkBackground=${#strings.isEmpty(darkMap) ? lightMap : darkMap}"
                 th:style="${#strings.isEmpty(lightBackground) ? null : '--hanlo-map-background-light:url(&quot;' + lightBackground + '&quot;);--hanlo-map-background-dark:url(&quot;' + darkBackground + '&quot;)'}">
                <span class="map-title" th:if="${not #strings.isEmpty(location)}">我现在住在
                    <b th:text="${location}"></b>
                </span>
            </div>
            <div class="author-content-item selfInfo single"
                 th:if="${not #lists.isEmpty(information)}">
                <div th:each="info, status : ${information}" th:if="${status.index < 3}">
                    <span class="selfInfo-title" th:text="${info.authorInfoTitle}"></span>
                    <span class="selfInfo-content hanlo-dynamic-color"
                          th:style="|--hanlo-dynamic-color:${#strings.isEmpty(info.authorInfoColor) ? 'var(--heo-fontcolor)' : info.authorInfoColor}|"
                          th:text="${info.authorInfoContent}"></span>
                </div>
            </div>
        </div>
    </div>
</th:block>
