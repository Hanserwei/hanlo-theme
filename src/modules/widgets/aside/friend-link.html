<!-- 通讯录 -->
<div class="card-widget card-friend-link" th:if="${pluginFinder.available('PluginLinks')}">
    <div class="item-headline"><i class="haofont hao-icon-tongxunlu07 hl:[font-size:0.9rem] hl:font-bold"
                                 ></i><span>通讯录</span></div>
    <div class="card-friend-link-container"
         th:with="groups = ${linkFinder.groupBy()},
                  defaultLinkLogo = ${assets_link + '/images/hanlo-logo.png'}">
        <th:block th:each="group,iterStat : ${groups}"
                  th:with="groupStyle=${#annotations.getOrDefault(group, 'displayStyle', 'default')}">
            <details th:if="${groupStyle != 'deprecated' && not #lists.isEmpty(group.links)}"
                     class="card-friend-class-name">
                <summary class="card-friend-class-desc" th:title="${#annotations.get(group, 'description')}">
                    <span>[[${group.spec.displayName}]]</span>
                    <span>[[${group.links.size}]]</span>
                </summary>
                <a th:each="link : ${group.links}"
                   th:with="linkLogo=${#strings.isEmpty(link.spec.logo) ? defaultLinkLogo : link.spec.logo}"
                   class="card-friend-item online-friend-link" th:href="${link.spec.url}" th:title="${link.spec.displayName}"
                   target="_blank" rel="noopener noreferrer external nofollow"><img class="no-lightbox card-friend-avatar"
                                        th:src="${isLazyload ? '' : linkLogo}"
                                        th:data-lazy-src="${isLazyload ? linkLogo : ''}"
                                        th:alt="${link.spec.displayName}">
                    <div class="card-friend-details">
                        <div class="card-friend-name">[[${link.spec.displayName}]]</div>
                        <div class="card-friend-descr" >[[${link.spec.description}]]</div>
                    </div>
                </a>
            </details>
            <details th:if="${#strings.equals(groupStyle,'deprecated') && not #lists.isEmpty(group.links)}"
                     class="card-friend-class-name">
                <summary class="card-friend-class-desc" th:title="${#annotations.get(group, 'description')}">
                    <span>[[${group.spec.displayName}]]</span>
                    <span>[[${group.links.size}]]</span>
                </summary>
                <a th:each="link : ${group.links}"
                   th:with="linkLogo=${#strings.isEmpty(link.spec.logo) ? defaultLinkLogo : link.spec.logo}"
                   class="card-friend-item offline-friend-link" th:href="${link.spec.url}" th:title="${link.spec.displayName}"
                   target="_blank" rel="noopener noreferrer external nofollow"><img class="no-lightbox card-friend-avatar"
                                        th:src="${isLazyload ? '' : linkLogo}"
                                        th:data-lazy-src="${isLazyload ? linkLogo : ''}"
                                        th:alt="${link.spec.displayName}">
                    <div class="card-friend-details">
                        <div class="card-friend-name">[[${link.spec.displayName}]]</div>
                        <div class="card-friend-descr" >[[${link.spec.description}]]</div>
                    </div>
                </a>
            </details>

        </th:block>

    </div>


</div>
