<!-- A single profile card: optional photo background, avatar/intro and persistent identity links. -->
<section class="card-widget hanlo-profile-card" data-profile-card aria-label="关于作者"
         th:with="profile=${theme.config.sidebar.profile},
                  hasBackground=${not #strings.isEmpty(profile.backgroundImg) && profile.backgroundImg != '/themes/theme-hanlo/assets/images/sidebar/profile.webp'},
                  profileName=${#strings.isEmpty(profile.profileName) ? site.title : profile.profileName},
                  avatar=${not #strings.isEmpty(profile.avatar) ? profile.avatar : (#strings.isEmpty(site.logo) ? assets_link + '/images/hanlo-logo.png' : site.logo)},
                  hasDescription=${not #strings.isEmpty(profile.profileDesc)}"
         th:classappend="${hasBackground ? 'has-background' : ''}">
    <link rel="stylesheet" th:href="${assets_link + '/css/profile-' + theme.spec.version + '.css' + theme_version}">
    <img th:if="${hasBackground}" class="hanlo-profile-background" th:src="${profile.backgroundImg}"
         alt="" loading="lazy" decoding="async" aria-hidden="true">

    <header class="hanlo-profile-header">
        <button type="button" class="hanlo-profile-greeting hanlo-button-reset" data-profile-greeting
                title="换一个标签" aria-label="切换个人标签">
            <span data-profile-greeting-text>👋 你好，很高兴认识你</span>
        </button>
    </header>

    <div class="hanlo-profile-stage">
        <div class="hanlo-profile-portrait" data-profile-portrait>
            <img class="hanlo-profile-avatar" th:src="${avatar}" th:alt="${profileName + '的头像'}"
                 width="144" height="144" loading="lazy" decoding="async">
            <span class="hanlo-profile-sticker"
                  th:if="${not #strings.isEmpty(profile.stickerImg) && profile.stickerImg != '/upload/omxo3N22290781690363822143.png'}">
                <img th:src="${profile.stickerImg}" alt="头像贴纸" width="32" height="32" loading="lazy" decoding="async">
            </span>
        </div>
        <div th:if="${hasDescription}" class="hanlo-profile-description" data-profile-description
             tabindex="0" role="region" aria-label="个人介绍" hidden th:utext="${profile.profileDesc}"></div>
    </div>

    <button th:if="${hasDescription}" type="button" class="hanlo-profile-toggle hanlo-button-reset"
            data-profile-toggle aria-expanded="false" hidden>
        <span data-profile-toggle-text>认识我</span>
        <th:block th:replace="~{modules/widgets/menu-icon :: menu-icon(icon='SwapOutlined')}"></th:block>
    </button>

    <div class="hanlo-profile-footer">
        <a class="hanlo-profile-identity" href="/about" title="了解更多">
            <span class="hanlo-profile-name" th:text="${profileName}"></span>
            <span class="hanlo-profile-subtitle" th:if="${not #strings.isEmpty(profile.desc)}" th:text="${profile.desc}"></span>
        </a>
        <div class="hanlo-profile-socials" th:if="${not #lists.isEmpty(profile.socialMedia)}">
            <a class="hanlo-profile-social" th:each="social : ${profile.socialMedia}"
               th:href="${social.url}" th:title="${#strings.isEmpty(social.name) ? '社交主页' : social.name}"
               th:aria-label="${#strings.isEmpty(social.name) ? '社交主页' : social.name}"
               target="_blank" rel="noopener noreferrer external nofollow">
                <th:block th:replace="~{modules/widgets/menu-icon :: menu-icon(icon=${#strings.isEmpty(social.icon) ? 'LinkOutlined' : social.icon})}"></th:block>
            </a>
        </div>
    </div>
</section>
