<!-- 公共的 head 部分，可以定义部分 links,scripts,styles -->
<th:block th:fragment="head(htmlType)">
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <meta content="telephone=no" name="format-detection">
    <meta content="var(--heo-card-bg)" name="theme-color">
    <title th:text="${siteTitle}"></title>
    <link rel="shortcut icon"
          th:href="@{${#strings.isEmpty(site.favicon) ? assets_link + '/images/hanlo-logo.png' : site.favicon}}"/>

    <script th:if="${theme.config.other.staticResource.use == 'custom'}" th:inline="javascript">
        (() => {
            const customAssetsBase = [[${assets_link}]]
            let shown = false
            const showWarning = () => {
                if (shown) return
                shown = true
                const warning = document.createElement('div')
                warning.className = 'hanlo-resource-warning'
                warning.setAttribute('role', 'alert')
                warning.textContent = '自定义静态资源地址不可用，页面已保留本地导航；部分样式或图片可能暂时缺失。'
                const attach = () => (document.body || document.documentElement).prepend(warning)
                if (document.body) attach()
                else document.addEventListener('DOMContentLoaded', attach, { once: true })
            }
            window.addEventListener('error', event => {
                const target = event.target
                const failedUrl = target instanceof HTMLLinkElement
                    ? target.href
                    : target instanceof HTMLScriptElement || target instanceof HTMLImageElement ? target.src : ''
                if (failedUrl.startsWith(customAssetsBase)) showWarning()
            }, true)
        })()
    </script>

    <link rel="stylesheet" th:href="${assets_link + '/zhheo/zhheoblog.css' + theme_version}">

    <link rel="stylesheet" th:href="${assets_link + '/zhheo/custom.css' + theme_version}">
    <link rel="stylesheet" th:href="@{/assets/css/phase4-runtime.css?v={version}(version=${theme.spec.version})}">

    <style th:if="${theme.config.other.scrollbarLinearGradientEnable}">
        *::-webkit-scrollbar-thumb {
            background-color: var(--heo-main);
            background-image: -webkit-linear-gradient(45deg,rgba(255,255,255,.4) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.4) 50%,rgba(255,255,255,.4) 75%,transparent 75%,transparent);
            border-radius: 2em
        }
    </style>

    <!-- Shiki 代码高亮 -->
    <th:block th:replace="~{macro/shiki-code}"/>

    <!-- 页脚内容-样式一 -->
    <th:block th:replace="~{modules/common/footer-style-one}"/>

    <script>
        (win => {
            const readStoredValue = key => {
                const itemText = localStorage.getItem(key)
                if (!itemText) return undefined
                try {
                    const item = JSON.parse(itemText)
                    if (!item || typeof item.expiry !== 'number' || Date.now() > item.expiry) {
                        localStorage.removeItem(key)
                        return undefined
                    }
                    return item.value
                } catch {
                    localStorage.removeItem(key)
                    return undefined
                }
            }

            const configuredMode = "[[${theme.config.style.colorScheme}]]"
            const storedMode = readStoredValue('theme')
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
            const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
            const hour = new Date().getHours()
            const automaticMode = prefersDark ? 'dark' : prefersLight ? 'light' : hour <= 6 || hour >= 18 ? 'dark' : 'light'
            const themeMode = configuredMode === 'dark' || configuredMode === 'light'
                ? configuredMode
                : storedMode === 'dark' || storedMode === 'light' ? storedMode : automaticMode
            document.documentElement.setAttribute('data-theme', themeMode)
            document.documentElement.classList.toggle('color-scheme-dark', themeMode === 'dark')

            const asideStatus = readStoredValue('aside-status')
            if (asideStatus !== undefined) {
                if (asideStatus === 'hide') {
                    document.documentElement.classList.add('hide-aside')
                } else {
                    document.documentElement.classList.remove('hide-aside')
                }
            }
        })(window)
    </script>

    <!-- icon图标 -->
    <link rel="stylesheet" th:href="${assets_link + '/icon/iconfont.css' + theme_version}">

    <th:block th:replace="~{modules/variables/site-config}" />


</th:block>
