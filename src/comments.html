<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{modules/layouts/layout :: layout(content = ~{::content}, htmlType = 'comments',title = ${singlePage.spec.title + ' | ' + site.title}, head = ~{::head})}">
<th:block th:fragment="head">
    <th:block th:replace="~{modules/common/open-graph :: open-graph(_title = ${singlePage.spec.title},
                _permalink = ${singlePage.status.permalink},
                _cover = ${singlePage.spec.cover},
                _excerpt = ${singlePage.status.excerpt},
                _type = 'website')}"></th:block>
    <link th:if="${theme.config.envelope_comment.enable_envelope_comment}" rel="stylesheet" data-hanlo-page-style
          th:href="${assets_link + '/css/comments-envelope-' + theme.spec.version + '.css' + theme_version}">
</th:block>
<th:block th:fragment="content">

    <div class="page" id="body-wrap">

        <!-- 头部导航栏 -->
        <header class="not-top-img" id="page-header">
            <nav th:replace="~{modules/nav :: nav(title = ${singlePage.spec.title})}"></nav>
        </header>

        <main class="layout hide-aside" id="content-inner">
            <div id="page">

                <th:block th:if="${theme.config.envelope_comment.enable_envelope_comment}">
                    <th:block th:if="${not #strings.isEmpty(theme.config.envelope_comment.title)}"
                              th:utext="${theme.config.envelope_comment.title}">
                    </th:block>


                    <div id="article-container">
                        <div id="maincontent">
                            <div id="form-wrap"
                                 th:style="|--hanlo-envelope-open-height: ${theme.config.envelope_comment.height}px|">
                                <img class="no-lightbox entered loaded" id="beforeimg"
                                     th:src="@{${theme.config.envelope_comment.custom_pic.beforeimg}}">
                                <div id="envelope">
                                    <form>
                                        <div class="formmain hl:pointer-events-none">
                                            <img class="headerimg no-lightbox entered loaded hl:w-full hl:overflow-hidden hl:pointer-events-none"
                                                 th:src="@{${theme.config.envelope_comment.custom_pic.cover}}"
                                                >
                                            <div class="comments-main">
                                                <h3 class="title3 hl:no-underline hl:[color:var(--heo-theme)] hl:text-center"
                                                   >
                                                    来自[[${site.title}]]的留言:</h3>
                                                <div class="comments hl:text-center hl:[border-bottom:#ddd_1px_solid] hl:[border-left:#ddd_1px_solid] hl:[padding-bottom:20px] hl:[background-color:#eee] hl:[margin:15px_0] hl:[padding-left:20px] hl:[padding-right:20px] hl:[border-top:#ddd_1px_solid] hl:[border-right:#ddd_1px_solid] hl:[padding-top:20px]"
                                                    
                                                     th:with="message = ${theme.config.envelope_comment.message_list}">

                                                    <div th:each="data : ${message}">[[${data}]]</div>

                                                </div>
                                                <div class="bottomcontent hl:text-center hl:[margin-top:40px]">
                                                    <img class="bottomimg no-lightbox entered loaded hl:w-full hl:[margin:5px_auto_5px_auto] hl:block hl:pointer-events-none"
                                                         th:src="@{${theme.config.envelope_comment.custom_pic.line}}"
                                                        >
                                                </div>
                                                <p class="bottomhr hl:[font-size:12px] hl:text-center hl:[color:#999]">
                                                    [[${theme.config.envelope_comment.bottom}]]</p>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                                <img id="afterimg" class="no-lightbox entered loaded"
                                     th:src="@{${theme.config.envelope_comment.custom_pic.afterimg}}">
                            </div>
                        </div>
                    </div>

                </th:block>

                <div class="flink" id="article-container">
                    <th:block  th:utext="${singlePage.content.content}"></th:block>
                </div>

                <hr>
                <!--/* 评论组件 */-->
                <th:block th:replace="~{modules/comment :: comment(group = 'content.halo.run',
                  kind = 'SinglePage',
                  name = ${singlePage.metadata.name},
                  allowComment = ${singlePage.spec.allowComment})}" />
            </div>

        </main>
        <!-- 底部 -->
        <footer th:replace="~{modules/footer}"/>
    </div>

</th:block>

</html>
