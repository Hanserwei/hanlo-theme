<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{modules/layouts/layout :: layout(content = ~{::content}, htmlType = 'author', title = ${(author?.spec?.displayName ?: '作者') + ' | ' + site.title}, head = ~{::head})}">
<th:block th:fragment="head">
    <th:block th:replace="~{modules/common/open-graph :: open-graph(_title = ${author?.spec?.displayName ?: site.title},
                _permalink = ${author != null ? '/authors/' + author.metadata.name : ''},
                _cover = ${#strings.isEmpty(author?.spec?.avatar) ? theme.config.other.opengraph.image : author.spec.avatar},
                _excerpt = ${#strings.isEmpty(author?.spec?.bio) ? site.seo.description : author.spec.bio},
                _type = 'profile')}"></th:block>
</th:block>
<th:block th:fragment="content">

    <div class="page" id="body-wrap">
        <!-- 头部导航栏 -->
        <header class="not-top-img" id="page-header">
            <nav th:replace="~{modules/nav :: nav(title = ${author?.spec?.displayName ?: '作者文章列表'})}"></nav>
        </header>
        <main class="layout" id="content-inner" th:classappend="${theme.config.sidebar.location}">
            <th:block th:replace="~{macro/post-list :: post-list(${author != null ? '/authors/' + author.metadata.name : ''})}" />
            <div th:replace="~{modules/aside :: aside(${theme.config.sidebar.widgetss.indexWidget})}"></div>
        </main>
        <!-- 底部 -->
        <footer th:replace="~{modules/footer}"/>
    </div>

</th:block>



</html>
