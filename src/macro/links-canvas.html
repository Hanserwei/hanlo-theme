<th:block th:fragment="links-canvas(groups)" th:if="${theme.config.link.linksCanvas && not #lists.isEmpty(groups)}" >

    <style>
        #link-canvas {
            display: block;
            width: 100%;
            height: 450px;
            border: var(--style-border);
            border-radius: 12px;
            background: var(--heo-card-bg);
        }

        .addBtn {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .addBtn button {
            transition: .2s;
            display: flex;
            margin: 31px auto 0px;
            color: var(--heo-white);
            padding: 15px;
            border-radius: 12px;
            background: var(--search-result-title);
            align-items: center;
        }

        button {
            padding: 0;
            outline: 0;
            border: none;
            background: 0 0;
            cursor: pointer;
            touch-action: manipulation;
        }

        .fa-solid,
        .fas {
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
        }

        .addBtn i {
            font-size: 1.3rem;
            margin-right: 10px;
        }

        .addBtn button:hover {
            background: #4b7aff;
            color: #fff;
        }
    </style>
    <div class="flink">
        <canvas id="link-canvas" width="960" height="450" aria-label="互动友链头像画布"></canvas>

        <div class="addBtn">
            <button data-hanlo-action="refresh-link-canvas">
                <i class="fas fa-shuffle"></i>
                换个头像试试
            </button>
        </div>
    </div>
    <script id="link-canvas-data" type="application/json" th:inline="javascript">[[${groups}]]</script>

</th:block>
