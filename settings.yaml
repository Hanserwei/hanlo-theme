            avatar: ""
            stickerImg: ""
            desc: 分享技术与生活
            helloText: "🤖 数码科技爱好者, 🔍 分享与热心帮助, 🏠 智能家居小能手, 🔨 设计开发一条龙"
          children:
            - $formkit: attachment
              name: backgroundImg
              label: 背景图片
              value: ""
              width: "12rem"
              aspectRatio: "4/5"
              placeholder: 留空使用透明背景
              help: "建议使用 4:5 竖图，推荐 800 × 1000 像素（至少 400 × 500），WebP 或 AVIF 格式。图片居中铺满并适当裁切，重要内容放在中央；留空时卡片透明，设置图片时自动叠加遮罩保证文字清晰。"
            - $formkit: attachment
              name: avatar
              label: 头像
              width: "8rem"
              aspectRatio: "1/1"
              placeholder: 留空使用站点 Logo
              help: 建议使用至少 256 × 256 像素的正方形图片，卡片中显示为圆形。
            - $formkit: attachment
              name: stickerImg
              label: 头像贴纸
              value: ""
              width: "5rem"
              aspectRatio: "1/1"
              placeholder: 可选，留空不显示
              help: 显示在头像右下角，建议使用 96 × 96 像素透明背景图片。
            - $formkit: text
              name: desc
              value: "分享技术与生活"
              label: 一句话简介
              help: 显示在卡片底部名称下方，建议不超过 20 个字。
              placeholder: 分享技术与生活
            - $formkit: text
              name: helloText
              label: 顶部标签
              placeholder: "如 🏠 智能家居小能手, 🔨 设计开发一条龙"
              help: 以中文或英文逗号分隔多个标签，点击卡片顶部的标签可以切换。
            - $formkit: text
              name: profileName
              label: 卡片名称
              placeholder: 如 小航的数字花园
              help: 留空使用站点名称；点击名称前往 /about。
            - $formkit: code
              name: profileDesc
              label: 个人介绍
              placeholder: 介绍自己、兴趣或正在做的事情
              height: 200px
              language: html
              help: 支持 HTML。鼠标悬浮或点击「认识我」时展示，建议使用 3～5 行短句；留空时只显示头像。
            - $formkit: array
              name: socialMedia
              label: 社交媒体
              help: 底部最多显示两个入口。支持 Ant Design 图标名称，如 GithubOutlined、MailOutlined，也兼容现有图标类名和图片地址。
              max: 2
              value: []
              itemLabels:
                - type: text
                  label: $value.name
              children:
                - $formkit: text
                  name: icon
                  label: 入口图标
                  placeholder: GithubOutlined 或 https://example.com/icon.svg
                  help: 支持 Ant Design 图标名、已有图标类名或图片地址；留空使用链接图标。图片建议 1:1、64 × 64 像素。
                - $formkit: text
                  name: name
                  label: 入口名称
                  help: 用于鼠标提示和读屏说明，建议填写平台名。
                  placeholder: GitHub
                - $formkit: url
                  name: url
                  label: 入口链接
                  help: 点击后在新标签页打开，可填写 HTTPS 地址或站内路径。
                  placeholder: https://github.com/your-name
          help: 在上方页面列表添加「个人卡片」后显示。卡片由顶部标签、头像与介绍、底部名称和社交入口组成；点击名称前往 /about，请准备对应页面。
        - $formkit: group
          name: music
          label: 音乐翻转卡片
          help: 先在页面列表添加「音乐卡片」。使用网易云最近听歌卡片服务生成图片，将用户 ID 替换成自己的；服务说明：https://github.com/zonemeen/netease-recent-profile
          value:
            musicUrl: /music
            lightMsimg: https://card-music.yyds.pink/?id=xxxxx&theme=card&themeColor=e60026&mode=light&size=300&show_random=1
            lightBackMsimg: https://card-music.yyds.pink/?id=xxxxx&size=60&type=1&mode=light&title=%E6%9C%80%E8%BF%91%E5%B8%B8%E5%90%AC%E6%A6%9C%E5%8D%95&number=6
            darkMsimg: https://card-music.yyds.pink/?id=xxxxx&theme=card&themeColor=e60026&mode=dark&size=300&show_random=1
            darkBackMsimg: https://card-music.yyds.pink/?id=xxxxx&size=60%E2%80%A6F%91%E5%B8%B8%E5%90%AC%E6%A6%9C%E5%8D%95&number=6
          children:
            - $formkit: url
              name: musicUrl
              label: 点击卡片前往
              help: 填写音乐主页或站内音乐页；留空时卡片仍展示，但不跳转。
              placeholder: /music 或 https://music.163.com/#/user/home?id=123456
            - $formkit: textarea
              name: lightMsimg
              label: 浅色模式 · 正面图片
              help: 填写可直接显示图片的完整 URL，用作卡片正面。服务图片保留输出比例；自制图片建议约 3:4、600 × 800 像素，四张图保持一致尺寸。
              placeholder: https://card-music.yyds.pink/?id=123456&mode=light&theme=card&size=300
            - $formkit: textarea
              name: lightBackMsimg
              label: 浅色模式 · 背面图片
              help: 填写可直接显示图片的完整 URL，用作悬停翻转后的背面。服务图片保留输出比例；自制图片建议约 3:4、600 × 800 像素，四张图保持一致尺寸。
              placeholder: https://card-music.yyds.pink/?id=123456&mode=light&size=60&type=1&number=6
            - $formkit: textarea
              name: darkMsimg
              label: 深色模式 · 正面图片
              help: 填写可直接显示图片的完整 URL，用作卡片正面。服务图片保留输出比例；自制图片建议约 3:4、600 × 800 像素，四张图保持一致尺寸。
              placeholder: https://card-music.yyds.pink/?id=123456&mode=dark&theme=card&size=300
            - $formkit: textarea
              name: darkBackMsimg
              label: 深色模式 · 背面图片
              help: 填写可直接显示图片的完整 URL，用作悬停翻转后的背面。服务图片保留输出比例；自制图片建议约 3:4、600 × 800 像素，四张图保持一致尺寸。
              placeholder: https://card-music.yyds.pink/?id=123456&mode=dark&size=60&type=1&number=6
        - $formkit: group
          name: steam
          label: Steam 游戏卡片
          help: 先在页面列表添加「Steam 游戏卡片」。使用 Steam Card 服务生成图片；服务说明：https://github.com/yuyinws/steam-card
          value:
            steamUrl: /
            cardSteam: https://card.yuy1n.io/card/xxxxxx/gradient1,badge,bg-game-1111460,games,screenshots,badges
          children:
            - $formkit: url
              name: steamUrl
              label: 点击卡片前往
              help: 填写 Steam 个人主页；留空时仅展示卡片，不跳转。
              placeholder: https://steamcommunity.com/profiles/76561198000000000/
            - $formkit: textarea
              name: cardSteam
              label: Steam 卡片图片地址
              help: 填写图片直链，使用 SteamID64 生成卡片；建议横图约 3:1、至少 600 × 200 像素，保留服务生成比例。
              placeholder: https://card.yuy1n.io/card/76561198000000000/gradient1,badge,games
        - $formkit: number
          name: recentPost
          label: 最新与热门文章数量
          value: 4
          help: 两种文章卡片共用数量，建议 4～8 篇。0 或负数按 Halo 分页上限读取（当前最多 1000 篇）。
          max: 1000
          step: 1
          validation: number|matches:/^-?\d+$/|max:1000
        - $formkit: group
          name: newcomment
          label: 最新评论卡片
          value:
            newcommentUrl: /newest
            newcommentnumber: 5
            providerMirror: "https://cravatar.cn"
          children:
            - $formkit: url
              name: newcommentUrl
              label: 查看更多评论的地址
              help: 卡片右上角的跳转链接；例如使用最新评论模板的 /newest 页面，留空隐藏入口。
              placeholder: /newest
            - $formkit: number
              name: newcommentnumber
              label: 最新评论数量
              help: 建议 5～10 条；负数使用 5 条，0 按 Halo 分页上限读取。
              max: 1000
              step: 1
              validation: number|matches:/^-?\d+$/|max:1000
            - $formkit: text
              label: 评论头像服务地址
              name: providerMirror
              help: 仅为没有头像的评论拼接 /avatar/邮箱哈希。填写服务根地址，不含 /avatar，末尾不加斜杠；使用官方源请填 https://gravatar.com。
              placeholder: https://cravatar.cn
          help: 显示站点最新评论；先在页面列表添加「最新评论」。评论头像服务也用于 /newest 最新评论页面。

        - $formkit: number
          name: categoryQuantity
          label: 分类卡片数量
          value: 0
          help: 建议 10～20 个；0 或负数按 Halo 分页上限读取（当前最多 1000 个）。
          max: 1000
          step: 1
          validation: number|matches:/^-?\d+$/|max:1000
        - $formkit: number
          name: tagQuantity
          label: 标签展示数量
          value: 0
          help: 标签卡片、组合卡片及控制中心等共用此数量。建议 20～50 个；0 或负数按 Halo 分页上限读取（当前最多 1000 个）。
          max: 1000
          step: 1
          validation: number|matches:/^-?\d+$/|max:1000
        - $formkit: switch
          name: tags_switch
          label: 组合卡片中显示标签
          value: true
          help: 仅影响「标签、归档与统计组合卡片」，不影响单独的标签卡片。
        - $formkit: switch
          name: archive_switch
          label: 组合卡片中显示月份归档
          value: false
          help: 仅影响「标签、归档与统计组合卡片」，启用后显示月份和文章数量。
    - group: footer
      label: 页脚
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 从装饰到站点信息，按页脚位置配置
            - $el: p
              attrs:
                style: margin:0
              children: 页脚从上到下包含动物装饰、站点介绍、社交入口与站点记录、分组导航、底部徽章与信息栏。各区域可单独开关；运行时间、备案和许可协议读取「基础」设置。
        - $formkit: switch
          name: animal_enable
          label: 动物装饰栏
          value: true
          help: 在正文与页脚之间显示动物和矮墙，自动留出空间。图片随主题提供，无需代码注入。
        - $formkit: group
          name: records
          label: 中央 Logo 与站点记录
          value:
            enable: true
            logo: /themes/theme-hanlo/assets/images/footer/shiba.svg
            text: ""
            runtime_enable: true
            voyager_enable: true
          children:
            - $formkit: switch
              name: enable
              id: hanlo_footer_records_enable
              label: 显示站点记录
              help: 在动物栏下方显示 Logo、记录文字和运行时间。
            - $formkit: attachment
              if: $get(hanlo_footer_records_enable).value
              name: logo
              label: 中央 Logo
              width: "8rem"
              aspectRatio: "1/1"
              help: 建议 1:1 正方形、至少 192 × 192 像素，透明背景更自然。点击返回顶部；留空使用主题自带柴犬。
              placeholder: 选择图片，或留空使用柴犬
              preserve: true
            - $formkit: textarea
              if: $get(hanlo_footer_records_enable).value
              name: text
              label: 记录文字
              placeholder: 写下你的站点寄语，支持多行
              help: 可填写自定义文字，显示在 Logo 下方；留空则不显示。
              preserve: true
            - $formkit: switch
              if: $get(hanlo_footer_records_enable).value
              name: runtime_enable
              label: 显示站点运行时间
              help: 根据「基础 → 建站时间」统计天、时、分、秒；请先填写有效的建站日期。
              preserve: true
            - $formkit: switch
              if: $get(hanlo_footer_records_enable).value
              name: voyager_enable
              label: 显示旅行者 1 号里程
              help: 从 1977 年 9 月 5 日发射时间起，按约 17 千米/秒估算飞行里程，仅作展示，不代表实时距地球距离。
              preserve: true
          help: 位于左右社交入口之间；记录文字与计时位于 Logo 下方，可分别开关。
        - $formkit: group
          name: footer_bar
          label: 页脚站点介绍栏
          value:
            footer_bar_enable: false
            logo: "困困鱼"
            description: "来自 困困鱼 最新设计与科技的文章"
          children:
            - $formkit: switch
              name: footer_bar_enable
              id: hanlo_footer_footer_bar_enable
              label: 显示站点介绍栏
              help: 在社交入口与站点记录上方展示。
            - $formkit: code
              if: $get(hanlo_footer_footer_bar_enable).value
              name: logo
              label: 介绍栏标题 HTML
              height: 80px
              language: html
              help: 可填写文字或 HTML 图片标签；图片建议高度 64～96 像素，保留原始比例。
              placeholder: 我的数字花园
              preserve: true
            - $formkit: textarea
              if: $get(hanlo_footer_footer_bar_enable).value
              name: description
              label: 介绍栏说明
              placeholder: 记录开发经验，也分享日常生活
              help: 显示在标题下方，建议用一句话概括站点内容。
              preserve: true
          help: 显示站点标题和简短描述，附带「了解更多」链接，固定跳转到首页。
        - $formkit: group
          name: social_media
          label: Logo 两侧的社交入口
          value:
            socialMediaLeft:
            socialMediaRight:
          children:
            - $formkit: array
              name: socialMediaLeft
              label: Logo 左侧入口
              value: []
              itemLabels:
                - type: text
                  label: $value.name
                - type: text
                  label: $value.url
              children:
                - $formkit: radio
                  name: option_social_data
                  label: 图标来源
                  value: icon
                  help: "已有主题图标选「图标类名」；需要 SVG 图标时选「图标库选择」。切换来源后请重新确认图标。"
                  options:
                    - value: icon
                      label: 图标类名
                    - value: custom
                      label: 图标库选择（SVG）
                - $formkit: textarea
                  name: icon
                  key: icon
                  if: $value.option_social_data == 'icon'
                  help: "填写主题已加载的图标类名，用空格分隔；此模式不解析 SVG、img 标签或图片 URL。"
                  label: 图标类名
                  validation: "required"
                  preserve: true
                  placeholder: haofont hao-icon-github
                - $formkit: iconify
                  if: $value.option_social_data == 'custom'
                  name: icon
                  key: custom_icon
                  label: 选择 SVG 图标
                  format: svg # svg / dataurl / url / name
                  preserve: true
                  help: 通过图标库选择，保存为 SVG 代码；与图标类名共用同一图标值，切换后请重新选择。
                - $formkit: text
                  name: name
                  label: 入口名称
                  validation: "required"
                  help: 鼠标悬停时显示，建议填写平台名或用途。
                  placeholder: GitHub
                - $formkit: text
                  name: url
                  label: 入口链接
                  validation: "required"
                  help: "可填写完整 HTTPS 地址、站内路径或 mailto: 邮箱链接。"
                  placeholder: https://github.com/your-name
              help: 按列表顺序展示；建议每侧 2～4 个，名称用于鼠标提示。
            - $formkit: array
              name: socialMediaRight
              label: Logo 右侧入口
              value: []
              itemLabels:
                - type: text
                  label: $value.name
                - type: text
                  label: $value.url
              children:
                - $formkit: radio
                  name: option_social_data
                  label: 图标来源
                  value: icon
                  options:
                    - value: icon
                      label: 图标类名
                    - value: custom
                      label: 图标库选择（SVG）
                  help: 已有主题图标选「图标类名」；需要 SVG 图标时选「图标库选择」。切换来源后请重新确认图标。
                - $formkit: textarea
                  if: $value.option_social_data == 'icon'
                  name: icon
                  key: icon
                  help: "填写主题已加载的图标类名，用空格分隔；此模式不解析 SVG、img 标签或图片 URL。"
                  label: 图标类名
                  validation: "required"
                  preserve: true
                  placeholder: haofont hao-icon-github
                - $formkit: iconify
                  if: $value.option_social_data == 'custom'
                  name: icon
                  key: custom_icon
                  label: 选择 SVG 图标
                  format: svg # svg / dataurl / url / name
                  preserve: true
                  help: 通过图标库选择，保存为 SVG 代码；与图标类名共用同一图标值，切换后请重新选择。
                - $formkit: text
                  name: name
                  label: 入口名称
                  validation: "required"
                  help: 鼠标悬停时显示，建议填写平台名或用途。
                  placeholder: GitHub
                - $formkit: text
                  name: url
                  label: 入口链接
                  validation: "required"
                  help: "可填写完整 HTTPS 地址、站内路径或 mailto: 邮箱链接。"
                  placeholder: https://github.com/your-name
              help: 按列表顺序展示；建议每侧 2～4 个，名称用于鼠标提示。
          help: 左右两组独立排序；图标与链接逐项配置，留空列表不显示对应入口。
        - $formkit: menuRadio
          name: menu
          label: 页脚分组导航
          help: 在「外观 → 菜单」创建菜单组：一级菜单作为栏目标题，二级菜单作为链接。选择有内容的菜单后，页脚友链栏才会显示。
        - $formkit: group
          name: footer_group
          label: 导航区的随机友链
          value:
            enable_footer_group: true
            num: 3
          children:
            - $formkit: switch
              name: enable_footer_group
              id: hanlo_footer_enable_footer_group
              key: enable_footer_group
              label: 显示随机友链栏
              help: 在页脚分组导航旁展示，更多入口使用「友链与朋友圈 → 友链列表地址」。
            - $formkit: number
              if: $get(hanlo_footer_enable_footer_group).value
              name: num
              label: 每批随机友链数量
              validation: number|matches:/^-?\d+$/|min:0|max:100
              help: 建议 3～6 个；0 只显示「更多」入口。
              min: 0
              max: 100
              step: 1
              preserve: true
          help: 依赖链接插件，以及上方已选择且有内容的页脚菜单；访客可点击刷新按钮换一批。
        - $formkit: group
          name: footerContent
          label: 页脚底部信息
          value:
            default_enable_group:
              default_enable: true
              dingyue: true
              zhuti: true
              about: true
              icp_icon: true
              gongwangan: true
              yingsi: true
              yunzhichi: false
              footer_banner_padding: 1
          children:
            - $formkit: group
              name: default_enable_group
              label: 底部徽章与信息栏
              value:
              children:
                - $formkit: switch
                  name: default_enable
                  id: hanlo_footer_default_enable
                  key: default_enable
                  label: 显示底部徽章与信息栏
                  help: 同时控制 Halo、Hanlo、建站年份徽章及底部版权与链接栏。
                - $formkit: number
                  if: $get(hanlo_footer_default_enable).value
                  name: footer_banner_padding
                  id: hanlo_footer_footer_banner_padding
                  key: footer_banner_padding
                  label: 底部信息栏上下留白（rem）
                  help: 上下内边距，不是固定高度；1 rem 通常约 16 像素，建议 0.5～2。
                  min: 0
                  max: 10
                  step: 0.25
                  validation: number|min:0|max:10
                  preserve: true
                - $formkit: switch
                  if: $get(hanlo_footer_default_enable).value
                  name: dingyue
                  id: hanlo_footer_dingyue
                  key: dingyue
                  label: 显示 RSS 订阅入口
                  help: 需要启用 RSS 插件（PluginFeed），链接为 /rss.xml；同时控制 RSS 徽章。
                  preserve: true
                - $formkit: switch
                  if: $get(hanlo_footer_default_enable).value
                  name: zhuti
                  id: hanlo_footer_zhuti
                  key: zhuti
                  label: 显示主题仓库链接
                  help: 链接到主题声明的代码仓库；不控制 Hanlo 版本徽章。
                  preserve: true
                - $formkit: switch
                  if: $get(hanlo_footer_default_enable).value
                  name: about
                  id: hanlo_footer_about
                  key: about
                  label: 显示关于入口
                  help: 链接固定为 /about，请先创建对应独立页面。
                  preserve: true
                - $formkit: switch
                  if: $get(hanlo_footer_default_enable).value
                  name: icp_icon
                  id: hanlo_footer_icp_icon
                  key: icp_icon
                  label: 显示 ICP 备案
                  help: 先在「基础」填写 ICP 备案号或备案图片；点击前往工信部备案查询。
                  preserve: true
                - $formkit: switch
                  if: $get(hanlo_footer_default_enable).value
                  name: gongwangan
                  id: hanlo_footer_gongwangan
                  key: gongwangan
                  label: 显示公安联网备案
                  help: 先在「基础」填写公安备案号或备案图片；点击前往公安备案网站。
                  preserve: true
                - $formkit: switch
                  if: $get(hanlo_footer_default_enable).value
                  name: yingsi
                  id: hanlo_footer_yingsi
                  key: yingsi
                  label: 显示版权许可协议入口
                  help: 使用「基础」中的版权协议地址，显示 CC BY-NC-ND 图标；请确认实际采用的许可协议。
                  preserve: true
                - $formkit: switch
                  if: $get(hanlo_footer_default_enable).value
                  name: yunzhichi
                  id: hanlo_footer_yunzhichi
                  key: yunzhichi
                  label: 显示腾讯云服务说明
                  help: 展示「提供 CDN 加速 / 云存储服务」文字并链接腾讯云，请按实际使用情况开启。
                  preserve: true
              help: 站点年份来自建站时间；开关分别控制下方链接。
          help: 控制底部站点徽章、版权年份和辅助链接；备案内容与协议地址在「基础」中填写。

    - group: post
      label: 文章详情
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 让文章更易读，也清楚说明来源
            - $el: p
              attrs:
                style: margin:0
              children: 这里配置正文前的摘要与时效提醒，以及文章底部的版权、分享和推荐。单篇文章元数据可覆盖摘要与版权开关；文章评论需同时启用评论组件插件、主题「评论」总开关和该文章的允许评论。
        - $formkit: switch
          name: dynamicBackground
          label: 从封面提取文章主色
          value: true
          help: 根据文章封面图片调整文章页主色。
        - $formkit: switch
          name: opacity
          label: 淡化并模糊未选中的目录项
          value: true
          help: 作用于文章侧栏目录；关闭后未选中的目录文字也保持清晰。
        - $formkit: group
          name: aiDescription
          label: 文章摘要卡片
          value:
            aiDescriptionEnable: false
            gptName:
            mode: local
            switchBtn: false
            btnLink:
            randomNum:
            basicWordCount:
            key:
            Referer:
          children:
            - $formkit: switch
              name: aiDescriptionEnable
              id: hanlo_post_aiDescriptionEnable
              key: aiDescriptionEnable
              value: false
              label: 显示文章摘要卡片
              help: 先启用，再选择摘要来源；使用本地模式时请在文章编辑中关闭自动摘要并填写摘要。
            - $formkit: text
              if: $get(hanlo_post_aiDescriptionEnable).value && ($get(hanlo_post_aiDescription_mode).value == 'local' || $get(hanlo_post_aiDescription_switchBtn).value)
              name: gptName
              label: 本地摘要助手名称
              placeholder: 如 小航
              value: KunKunYu
              help: 显示为「名称 GPT」，用于本地模式的卡片标签和介绍。
              preserve: true
            - $formkit: radio
              if: $get(hanlo_post_aiDescriptionEnable).value
              name: mode
              label: 默认摘要来源
              value: local
              help: 本地模式使用文章手动摘要；Tianli 模式需配置服务 Key 和站点地址。
              options:
                - label: 文章手动摘要
                  value: local
                - label: Tianli 在线生成
                  value: tianli
              id: hanlo_post_aiDescription_mode
              preserve: true
            - $formkit: switch
              if: $get(hanlo_post_aiDescriptionEnable).value
              name: switchBtn
              label: 允许切换摘要来源
              value: false
              help: 访客可在本地与 Tianli 模式间切换；开启时请同时准备手动摘要和 Tianli 配置。
              id: hanlo_post_aiDescription_switchBtn
              preserve: true
            - $formkit: url
              if: $get(hanlo_post_aiDescriptionEnable).value && ($get(hanlo_post_aiDescription_mode).value == 'tianli' || $get(hanlo_post_aiDescription_switchBtn).value)
              name: btnLink
              label: Tianli 服务介绍链接
              placeholder: https://example.com/ai-summary
              value: ""
              help: 访客点击 Tianli 标签后，可通过介绍按钮访问此链接。
              preserve: true
            - $formkit: number
              if: $get(hanlo_post_aiDescriptionEnable).value && ($get(hanlo_post_aiDescription_mode).value == 'tianli' || $get(hanlo_post_aiDescription_switchBtn).value)
              name: randomNum
              label: 刷新时的取样字数变化范围
              value: 3
              help: Tianli 刷新摘要时随机调整正文取样字数；不是刷新次数限制。建议 3～100；0 按最小范围 1 处理。
              min: 0
              max: 1000
              step: 1
              validation: number|matches:/^-?\d+$/|min:0|max:1000
              preserve: true
            - $formkit: number
              if: $get(hanlo_post_aiDescriptionEnable).value && ($get(hanlo_post_aiDescription_mode).value == 'tianli' || $get(hanlo_post_aiDescription_switchBtn).value)
              name: basicWordCount
              label: 正文基础取样字数
              value: 1000
              help: 提交给 Tianli 的标题和正文取样长度，建议 1000～1999；刷新取样最多截取 2000 字符。
              min: 1000
              max: 1999
              step: 1
              validation: number|matches:/^-?\d+$/|min:1000|max:1999
              preserve: true
            - $formkit: text
              if: $get(hanlo_post_aiDescriptionEnable).value && ($get(hanlo_post_aiDescription_mode).value == 'tianli' || $get(hanlo_post_aiDescription_switchBtn).value)
              name: key
              label: Tianli 服务 Key
              value: xxxx
              placeholder: 填写 Tianli 为本站提供的 Key
              help: 填写为本站签发的 Tianli Key。该值会发送到访客浏览器，请仅使用允许前端调用的服务 Key。
              preserve: true
            - $formkit: url
              if: $get(hanlo_post_aiDescriptionEnable).value && ($get(hanlo_post_aiDescription_mode).value == 'tianli' || $get(hanlo_post_aiDescription_switchBtn).value)
              name: Referer
              label: Tianli 绑定的站点地址
              help: 与服务绑定地址保持一致，填写完整 HTTPS 地址并保留末尾斜杠；浏览器实际 Referer 仍受来源策略控制。
              value: https://xx.xx/
              placeholder: https://blog.example.com/
              preserve: true
          help: 显示在正文上方。本地模式读取手动填写的文章摘要，可用英文逗号分隔多段供刷新切换；Tianli 模式通过外部服务生成摘要。单篇文章的 AI 元数据可覆盖显示开关。
        - $formkit: group
          name: passage_tips
          label: 正文更新时效提醒
          value:
            enable: false
            content: 文章内容可能已经过时。
            day: 7
          children:
            - $formkit: switch
              name: enable
              id: hanlo_post_passage_tips_enable
              label: 显示内容时效提醒
              help: 超过下方天数后才显示，不会隐藏或修改文章正文。
            - $formkit: number
              if: "$get(hanlo_post_passage_tips_enable).value"
              name: day
              label: 超过多少天后提醒
              validation: number|matches:/^-?\d+$/|min:0|max:36500
              help: 距最后修改时间严格超过此天数才显示；0 表示满一天后即可提醒。
              min: 0
              max: 36500
              step: 1
              preserve: true
            - $formkit: code
              if: "$get(hanlo_post_passage_tips_enable).value"
              name: content
              height: 100px
              label: 时效提醒正文 HTML
              help: "时间前缀由主题自动生成；这里只填写后半段提醒，可使用简短 HTML。"
              language: html
              placeholder: 文章内容可能已经过时，请结合最新文档阅读。
              preserve: true
          help: 在正文开始处提示内容可能过时，以文章最后修改时间计算。
        - $formkit: switch
          name: update_time
          label: 显示最后更新时间
          value: false
          help: 在文章标题下的信息栏中显示最后修改日期。
        - $formkit: select
          name: copyrightsStyle
          id: hanlo_post_copyrightsStyle
          key: copyrightsStyle
          label: 文章底部版权区布局
          value: default
          options:
            - value: default
              label: 文章标题与链接布局
            - value: one
              label: 作者头像卡片布局
          help: 两种布局都支持声明与分享；作者卡片布局使用文章作者头像和站点名称。
        - $formkit: text
          if: $get(hanlo_post_copyrightsStyle).value == 'one'
          name: desc
          value: "分享设计与科技生活"
          label: 作者卡片的一句话说明
          help: 仅用于作者头像卡片布局，显示在站点名称下方。
          placeholder: 分享设计与科技生活
          preserve: true
        - $formkit: group
          name: post_edit
          label: 版权区附加链接
          value:
            enable_post_edit: false
            post_edit_url: "/rss"
          children:
            - $formkit: switch
              name: enable_post_edit
              id: hanlo_post_enable_post_edit
              key: enable_post_edit
              help: 链接显示在文章底部分享按钮旁。
              label: 显示版权区附加链接
            - $formkit: url
              name: post_edit_url
              if: $get(hanlo_post_enable_post_edit).value
              label: 附加链接目标地址
              placeholder: /about 或 /rss.xml
              help: 填写站内说明页或订阅地址，链接文字由版权区布局决定。
              preserve: true
          help: 文章标题布局显示「运营模式与责任」；作者卡片布局显示「订阅」，请按所选布局设置目标页面。
        - $formkit: group
          name: share_right
          label: 文章分享入口
          value:
            mobile_edit: true
            weibo_edit: true
            copyurl_edit: true
          children:
            - $formkit: switch
              name: mobile_edit
              help: 访客可扫码在手机上打开当前文章。
              value: true
              label: 显示手机访问二维码
            - $formkit: switch
              name: weibo_edit
              help: 点击打开微博分享页。
              label: 显示微博分享入口
            - $formkit: switch
              name: copyurl_edit
              help: 点击复制当前页面地址，适合粘贴到聊天或社交平台。
              value: true
              label: 显示复制链接按钮
          help: 显示在文章底部版权区，可分别开启二维码、微博与复制链接。
        - $formkit: group
          name: copyrights
          label: 文章版权声明
          help: 这里提供全站默认值；单篇文章的版权开关、原创 / 转载类型和版权链接元数据优先。关闭声明后，文章底部布局和分享入口仍保留。
          value:
            enable: true
            content: '本文是原创文章，采用 <a target="_blank" href="/cc">CC BY-NC-ND 4.0</a> 协议，完整转载请注明来自 <a href="/" target="_blank" >程序员小航</a>'
            reprintContent: "本文是转载文章，版权归原作者所有。建议访问原文，转载本文请联系原作者。"
          children:
            - $formkit: switch
              name: enable
              help: 未单独设置版权开关的文章使用此值；单篇文章可以覆盖，以下内容也供单篇开启时使用。
              label: 默认显示版权声明
            - $formkit: text
              name: originalUrl
              label: 原创标记的默认链接
              placeholder: /cc
              help: 用于原创文章的「原创」标记，可指向版权说明页；单篇版权链接优先。留空且单篇未设置时没有有效目标。
            - $formkit: text
              name: reprintUrl
              label: 转载标记的默认原文链接
              placeholder: https://example.com/original-article
              help: 单篇版权链接优先，转载文章建议逐篇填写实际来源，避免不同文章共用同一原文。
            - $formkit: code
              name: content
              label: 原创文章声明 HTML
              placeholder: "<p>本文由本站原创，转载时请注明作者与文章链接。</p>"
              height: 120px
              language: html
              help: 显示于原创文章底部；请将协议、署名、站点地址替换为自己的内容。
            - $formkit: code
              name: reprintContent
              label: 转载文章声明 HTML
              placeholder: "本文是转载文章，版权归原作者所有。建议访问原文，转载本文请联系原作者。"
              height: 120px
              language: html
              help: 显示于转载文章底部；在文章元数据中选择转载类型，并填写该文章的原文链接。
        - $formkit: select
          name: recommendQuantity
          label: 底部推荐文章数量
          value: six
          options:
            - value: two
              label: 两篇
            - value: six
              label: 六篇
          help: 从文章第一个分类中推荐相关阅读；没有分类时不显示，实际数量取决于该分类可用文章。

    - group: categories
      label: 分类集合页
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 配置分类集合页，而不是分类文章列表
            - $el: p
              attrs:
                style: margin:0
              children: 这些设置作用于 /categories 分类集合页。分类名称、封面和描述在「文章 → 分类」维护；点入某个分类后的文章列表侧栏在「侧栏」设置。
        - $formkit: select
          name: use
          label: 分类集合页布局
          value: default
          options:
            - label: 分类名称与文章数列表
              value: default
            - label: 封面卡片（3D 悬停效果）
              value: 3D
          help: 作用于 /categories。文字列表展示名称和文章数；封面卡片使用分类封面与描述，请在「文章 → 分类」中完善，封面建议 1:1、至少 640 × 640 像素。

    - group: moment
      label: 瞬间
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 为瞬间内容配置页首横幅
            - $el: p
              attrs:
                style: margin:0
              children: 此处设置瞬间页面的背景、标题、说明和按钮。请先安装并启用瞬间插件，在插件中发布内容；这里只调整主题横幅，不改变瞬间内容或发布方式。
        - $formkit: attachment
          name: backgroundImg
          label: 瞬间页横幅背景
          width: "15rem"
          aspectRatio: "16/9"
          value: https://liuzhihang.com/upload/moments.png
          placeholder: 选择横幅图片或填写图片直链
          help: 建议使用 16:9、1920 × 1080 像素横图，WebP 或 AVIF 格式。横幅会裁切，主体放在中间，左侧留出标题空间。
        - $formkit: text
          name: smallTitle
          label: 横幅上方小标题
          value: 即刻短文
          help: 位于主标题上方，建议 4～8 个字。
          placeholder: 即刻短文
        - $formkit: text
          name: bigTitle
          label: 横幅主标题
          value: 分享生活的小确幸
          help: 横幅中的醒目标题，建议控制在 16 个字以内。
          placeholder: 分享生活的小确幸
        - $formkit: text
          name: detail
          label: 横幅底部说明
          value: 使用 Halo/Moment插件 构建
          help: 用一句话介绍瞬间内容，建议不超过 30 个字。
          placeholder: 记录日常、灵感和片刻心情
        - $formkit: text
          name: buttonTitle
          label: 横幅按钮文字
          value: 部署瞬间
          help: 按钮位于横幅右下方，仅在填写跳转地址时显示。
          placeholder: 了解我的日常
          if: $get(hanlo_moment_buttonUrl).value
          preserve: true
        - $formkit: url
          name: buttonUrl
          validation: url
          value: https://githubfast.com/halo-sigs/plugin-moments
          label: 横幅按钮跳转地址
          placeholder: https://example.com/about
          help: 填写完整 HTTP / HTTPS 地址；留空隐藏整个按钮。点击在新标签页打开。
          id: hanlo_moment_buttonUrl

    - group: link
      label: 友链与朋友圈
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 友链站点与朋友圈文章分别配置
            - $el: p
              attrs:
                style: margin:0
              children: 友链页面依赖链接插件，站点、分组、头像和展示样式在插件中维护。下方分别设置友链横幅、互动与评论，以及朋友圈插件文章流的加载数量。
        - $formkit: text
          name: smallTitle
          label: 友链页横幅小标题
          value: 友情链接
          help: 位于主标题上方，建议 4～8 个字。
          placeholder: 友情链接
        - $formkit: text
          name: bigTitle
          label: 友链页横幅主标题
          value: 我和我的小伙伴们
          help: 介绍你的朋友们，建议控制在 16 个字以内。
          placeholder: 我和我的小伙伴们
        - $formkit: url
          name: linksUrl
          value: "/links"
          label: 友链列表地址
          help: 页脚随机友链的「更多」入口使用此地址；填写链接插件实际的列表路径。
          placeholder: /links
        - $formkit: switch
          name: linksCanvas
          label: 显示互动友链头像画布
          value: false
          help: 在友链列表中显示头像互动区域，需要链接插件中已有友链分组与头像。
        - $formkit: switch
          name: enable_comment
          label: 允许友链页评论
          help: "需链接插件 1.4.0 或更新版本、启用评论组件插件，并打开主题「评论」总开关。"
        - $formkit: code
          name: linksArticle
          height: 300px
          label: 友链列表下方补充说明 HTML
          language: html
          help: 可放置申请友链要求或站点信息；在评论区上方展示，留空不显示。
          placeholder: <h2>申请友链</h2><p>请留下站点名称、地址、简介和头像。</p>
        - $formkit: text
          name: fmomentsPageSize
          label: 朋友圈每批加载文章数
          help: "作用于朋友圈文章流的滚动加载，需要朋友圈插件；不是友链站点数量。建议 12～30 条。"
          value: 12
          inputmode: numeric
          validation: number|matches:/^\d+$/|between:1,100
          placeholder: "12"

    - group: photos
      label: 图库与相册
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 配置照片列表和相册分组的展示
            - $el: p
              attrs:
                style: margin:0
              children: 先安装并启用图库插件，在插件中维护照片和分组；相册入口需新建页面并选择相册页面模板。分组封面、背景和说明在图库分组中填写。
        - $formkit: select
          name: photosStyle
          id: hanlo_photos_photosStyle
          key: hanlo_photos_photosStyle
          label: 相册与照片布局
          value: default
          options:
            - value: default
              label: 封面卡片与横幅
            - value: one
              label: 简洁分组与照片
          help: 同时影响相册分组入口和照片列表；带封面布局显示横幅与返回按钮，简洁布局以分组名称和照片为主。两种布局的照片均按原比例以瀑布流展示，每页数量和分页仍由图库插件控制。
        - $formkit: text
          name: topLink
          key: topLink
          if: $get(hanlo_photos_photosStyle).value == 'default'
          label: 横幅返回按钮地址
          value: "/album"
          preserve: true
          help: 填写已创建的相册分组页面地址，点击照片页横幅上的“返回”时跳转。
          placeholder: /album
        - $formkit: switch
          name: tagEnable
          label: 显示照片名称标签
          value: false
          help: 在照片左上角显示图库中填写的照片名称；两种布局均支持。
        - $formkit: attachment
          name: backgroundImg
          key: hanlo_photos_backgroundImg
          id: hanlo_photos_backgroundImg
          label: 全部照片页横幅
          width: "15rem"
          aspectRatio: 8/3
          value: https://liuzhihang.com/upload/moments.png
          placeholder: 选择横幅图片或填写图片 URL
          help: 用于未筛选分组的照片页；分组照片页使用各分组背景。建议 1600×600 像素、约 8:3，主体居中，边缘可能裁切。
          if: $get(hanlo_photos_photosStyle).value == 'default'
          preserve: true

    - group: todo
      label: 待办清单页面
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 把目标整理成左右两列清单
            - $el: p
              attrs:
                style: margin:0
              children: 新建页面并选择待办页面模板。这里维护清单分组与完成状态；页面顶部的标题、封面和摘要在页面编辑器中设置。
        - $formkit: array
          name: list
          label: 清单分组
          value: []
          itemLabels:
            - type: text
              label: $value.class_name
          children:
            - $formkit: text
              name: class_name
              label: 分组标题
              placeholder: 例如：今年想完成的事
              help: 显示在这组待办事项上方。
            - $formkit: radio
              name: seat
              label: 桌面展示列
              value: left
              options:
                - label: 左列
                  value: left
                - label: 右列
                  value: right
              help: 选择分组在桌面双列布局中的位置；窄屏会按布局收拢。
            - $formkit: array
              name: todo_list
              label: 组内待办事项
              value: []
              itemLabels:
                - type: text
                  label: $value.content
              children:
                - $formkit: textarea
                  name: content
                  label: 待办事项
                  placeholder: 例如：完成一次城市徒步
                  help: 按纯文本显示，建议用一句话描述目标。
                - $formkit: radio
                  name: completed
                  label: 完成状态
                  value: false
                  options:
                    - label: 已完成
                      value: true
                    - label: 未完成
                      value: false
                  help: 已完成的事项显示勾选图标和完成样式；访客无法在前台修改。
              help: 每项填写一件事，完成后可在这里更新状态。
              addLabel: 添加待办事项
          help: 每项是一组清单，可分别放入左列或右列；同列按列表顺序显示。
          addLabel: 添加清单分组

    - group: equipment
      label: 装备页面
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 装备展示与页面介绍
            - $el: p
              attrs:
                style: margin:0
              children: 需要 Halo 2.26.0 及以上，并安装启用装备插件 2.0.0 或更新版本。访问 /equipments 查看；这里设置顶部横幅，装备内容在后台「装备」中管理。
            - $el: p
              attrs:
                style: "margin: .4rem 0 0;"
              children: 每件装备可填写类型、使用状态、简短概述和多行使用感受；详细配置在参数列表中逐项添加，支持同名参数及换行。「重点展示」使用宽卡片，未选封面时显示设备类型图标。
        - $formkit: attachment
          name: backgroundImg
          label: 装备页横幅
          width: "15rem"
          aspectRatio: 8/3
          value: https://liuzhihang.com/upload/moments.png
          placeholder: 选择装备页横幅或填写图片 URL
          help: 建议 1600×600 像素、约 8:3；图片会铺满横幅并可能裁切，避免在图中放重要文字。
        - $formkit: text
          name: smallTitle
          label: 横幅上方短标签
          value: 好物
          help: 显示在主标题上方，建议 2–6 个字。
          placeholder: 例如：好物分享
        - $formkit: text
          name: bigTitle
          label: 横幅主标题
          value: 实物装备推荐
          help: 用于装备页顶部的大标题；下方分组标题在装备插件中设置。
          placeholder: 例如：我的日常装备
        - $formkit: text
          name: detail
          label: 横幅介绍
          value: 跟我一起享受科技带来的乐趣
          help: 显示在横幅底部，建议一句话说明推荐范围。
          placeholder: 例如：记录让我工作和生活更顺手的好物

    - group: envelope_comment
      label: 留言板页面
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 给留言板添加一封欢迎信
            - $el: p
              attrs:
                style: margin:0
              children: 新建页面并选择留言板页面模板。信笺只负责顶部装饰和欢迎文案；下方留言还需开启全站评论、启用评论组件插件，并允许该页面评论。
        - $formkit: switch
          label: 显示欢迎信笺
          name: enable_envelope_comment
          key: hanlo_envelope_comment_enable_envelope_comment
          id: hanlo_envelope_comment_enable_envelope_comment
          value: true
          help: 开启后在留言板顶部展示信封；桌面悬停展开，手机直接展示信纸内容。
        - $formkit: code
          if: $get(hanlo_envelope_comment_enable_envelope_comment).value
          name: title
          label: 信笺上方标题
          placeholder: <div style="text-align:center">给我留言</div>
          value: <div align="center">留言板</div>
          height: 80px
          language: html
          help: 支持 HTML，可设置居中或换行；留空不显示标题。
          preserve: true
        - $formkit: group
          name: custom_pic
          if: $get(hanlo_envelope_comment_enable_envelope_comment).value
          label: 信封与信纸图片
          value:
            cover:
            line:
            beforeimg:
            afterimg:
          children:
            - $formkit: attachment
              name: cover
              label: 信纸顶部插图
              placeholder: 选择信纸顶部插图或填写图片 URL
              width: "15rem"
              aspectRatio: 96/59
              value: "/themes/theme-hanlo/assets/images/envelope/cover.jpg"
              help: 位于信纸正文上方。建议 960×590 像素、约 96:59，按信纸宽度缩放。
            - $formkit: attachment
              name: line
              label: 信纸底部分隔图
              placeholder: 选择细长分隔图或填写图片 URL
              width: "15rem"
              aspectRatio: 20/1
              value: "/themes/theme-hanlo/assets/images/envelope/line.png"
              help: 位于正文和落款之间。建议 1920×95 像素、约 20:1 的横向装饰条，推荐透明 PNG。
            - $formkit: attachment
              name: beforeimg
              label: 信封背面图
              placeholder: 选择信封背面 PNG 或填写图片 URL
              width: "15rem"
              aspectRatio: 530/317
              value: "/themes/theme-hanlo/assets/images/envelope/before.png"
              help: 桌面展开时位于信纸后方。建议 530×317 像素、约 5:3，保留透明区域；手机不显示外壳。
            - $formkit: attachment
              name: afterimg
              label: 信封正面图
              placeholder: 选择信封正面 PNG 或填写图片 URL
              width: "15rem"
              aspectRatio: 530/259
              value: "/themes/theme-hanlo/assets/images/envelope/after.png"
              help: 覆盖信纸下半部。建议 530×259 像素、约 2:1 的透明 PNG；手机不显示外壳。
          preserve: true
          help: 四张图分别组成信纸装饰和信封外壳；替换时保持下方建议比例，透明外壳使用 PNG。
        - $formkit: list
          if: $get(hanlo_envelope_comment_enable_envelope_comment).value
          name: message_list
          label: 信纸正文行
          addLabel: 添加正文行
          help: 每项在信纸上单独显示一行，支持纯文本；可调整顺序。
          itemType: string
          value:
            - 有什么想问的？
            - 有什么想说的？
            - 有什么想吐槽的？
            - 哪怕是有什么想吃的，都可以告诉我哦~
          children:
            - $formkit: text
              index: "$index"
              validation: required
              label: 正文行
              help: 写一句给访客的邀请或说明。
              placeholder: 例如：欢迎分享你的近况
          preserve: true
        - $formkit: text
          name: bottom
          if: $get(hanlo_envelope_comment_enable_envelope_comment).value
          label: 信纸底部落款
          placeholder: 例如：期待收到你的来信
          value: 自动书记人偶竭诚为您服务！
          help: 显示在分隔图下方，使用单行纯文本。
          preserve: true
        - $formkit: number
          name: height
          if: $get(hanlo_envelope_comment_enable_envelope_comment).value
          label: 桌面展开高度（像素）
          placeholder: "1024"
          help: 控制鼠标悬停时的信封容器高度。建议从 1024 开始按正文长度调整，过小会裁切信纸；手机不受此项影响。
          value: 1024
          preserve: true
          min: 1
          step: 1

    - group: about
      label: 关于页面
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 按展示顺序组织个人介绍
            - $el: p
              attrs:
                style: margin:0
              children: 新建页面并选择关于页面模板，页面标题在页面编辑器中填写。先选择并拖动下方内容区块，再编辑对应内容；取消选择会隐藏区块设置并保留已填内容。头像、个人标签、建站故事和十年之约独立展示。
        - $formkit: attachment
          name: aboutAuthorImage
          label: 页面顶部头像
          value: https://liuzhihang.com/upload/recommend.png
          help: 建议 400×400 像素、1:1，人物居中以适应圆形裁切；留空使用主题标志。
          placeholder: 选择个人头像或填写图片 URL
          width: 15rem
          aspectRatio: 1/1
        - $formkit: select
          name: widget_list
          multiple: true
          sortable: true
          label: 内容区块与展示顺序
          help: 选中的区块按此处顺序显示，可拖动排序；每个成对区块会一起出现。取消选择后保留配置，再次选中即可继续编辑。
          value:
            - content-idea
            - hello-about
            - authorCareers
            - personalities-photo
            - textarea
            - game
            - like-music
            - statistics-map
          options:
            - value: content-idea
              label: 自我介绍与想法
            - value: hello-about
              label: 互动问候横幅
            - value: authorCareers
              label: 技能与职业生涯
            - value: personalities-photo
              label: 人格与个人照片
            - value: textarea
              label: 双栏座右铭
            - value: game
              label: 游戏与追番爱好
            - value: like-music
              label: 关注偏好与音乐
            - value: statistics-map
              label: 居住地与个人信息
          id: hanlo_about_widget_list

        - $formkit: list
          name: author_info_left_tags
          label: 头像左侧标签
          addLabel: 添加左侧标签
          help: 每项显示为一个个人标签，建议 2–8 个字；留空不显示这一侧标签。
          itemType: string
          children:
            - $formkit: text
              index: "$index"
              validation: required
              label: 个人标签
              help: 用简短词语介绍一个兴趣或身份。
              placeholder: 例如：徒步爱好者
        - $formkit: list
          name: author_info_right_tags
          label: 头像右侧标签
          addLabel: 添加右侧标签
          help: 每项显示为一个个人标签，建议与左侧数量接近；留空不显示这一侧标签。
          itemType: string
          children:
            - $formkit: text
              index: "$index"
              validation: required
              label: 个人标签
              help: 用简短词语介绍一个特点。
              placeholder: 例如：持续学习中
        - $formkit: code
