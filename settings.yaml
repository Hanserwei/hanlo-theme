                    - value: "stat"
                      label: 站点统计
                    - value: "tags-stat"
                      label: 标签、归档与统计组合卡片
                    - value: "custom_html"
                      label: 自定义 HTML 卡片
                  help: 个人、音乐与 Steam 卡片在下方配置；「通讯录」需要链接插件，并为友链分组设置展示样式。
                - $formkit: group
