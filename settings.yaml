apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-hanlo-setting
spec:
  forms:
    - group: basics
      label: 站点信息与备案
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 先确认站点名称与建站日期
            - $el: p
              attrs:
                style: margin:0
              children: 这里设置导航栏显示名称、建站日期及页脚备案信息。浏览器标题和首页首屏标题来自 Halo「设置 → 基本设置」；备案与版权链接还需在主题页脚设置中开启对应入口。
        - $formkit: code
          name: siteTitle
          label: 导航栏站点名称
          placeholder: 我的博客
          height: 80px
          language: html
          help: 留空使用 Halo 站点标题。仅替换导航栏名称，支持 HTML；普通名称直接填写文字即可。
        - $formkit: date
          name: siteStartTime
          label: 建站日期
          validation: required
          value: "2023-08-05"
          help: 必填，格式为年-月-日。用于页脚建站年份、运行时长及侧栏站点统计。
        - $formkit: text
          name: icp
          label: ICP 备案号
          placeholder: 皖ICP备12345678号
          help: 选填，留空不显示。填写完整备案号后，还需开启页脚的 ICP 备案入口；点击后进入工信部备案查询网站。
        - $formkit: text
          name: gongan
          label: 公安联网备案号
          placeholder: 皖公网安备12345678901234号
          help: 选填，留空不显示。填写完整备案号后，还需开启页脚的公安备案入口；当前链接进入公安备案查询网站。
        - $formkit: url
          name: copyrightAgreement
          label: 页脚版权协议地址
          placeholder: https://creativecommons.org/licenses/by-nc-nd/4.0/deed.zh-hans
          help: 选填，例如 CC BY-NC-ND 4.0 协议地址；需开启页脚版权协议入口。文章末尾声明请在「文章」设置中单独配置。
        - $el: div
          attrs:
            style: "margin-top: 0.75rem; padding: 0.75rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.5rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.7;"
          children: 备案字段也支持以 https:// 开头的备案图片地址，建议使用清晰、紧凑的横图；填写图片不会改变查询链接。页脚版权入口使用固定的 CC BY-NC-ND 图标，修改协议地址不会更换图标。

    - group: nav
      label: 顶部导航
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 先建菜单，再选择显示位置
            - $el: p
              attrs:
                style: margin:0
              children: 在「外观 → 菜单」中配置菜单项并指定主菜单，主菜单用于桌面顶部与手机侧栏。站点名左侧使用单独选择的菜单组；下方可分别控制设备显示和右侧功能按钮。
        - $formkit: group
          name: menus
          label: 菜单显示位置
          value:
            pc_leftMenu: true
            phone_leftMenu: true
            phone_menu: true
            submenu_layout: dropdown
          children:
            - $formkit: switch
              name: pc_leftMenu
              id: hanlo_nav_pc_leftMenu
              label: 桌面端显示站点名左侧菜单
              help: 在站点名称左侧显示菜单入口，使用下方选择的菜单组。
            - $formkit: switch
              name: phone_leftMenu
              label: 手机侧栏显示站点名左侧菜单组
              help: 在手机展开的导航侧栏中显示同一菜单组，可与桌面端独立开启。
              id: hanlo_nav_phone_leftMenu
            - $formkit: switch
              name: phone_menu
              label: 手机侧栏显示主菜单
              help: 在手机展开的导航侧栏中显示 Halo 主菜单及其子菜单。
            - $formkit: select
              name: submenu_layout
              label: 桌面主菜单的子菜单展开方式
              help: 下拉列表在父菜单下方展开；横向一行在导航栏下方展开。菜单项元数据可单独覆盖此设置，手机端始终使用折叠菜单。
              options:
                - label: 父菜单下方的下拉列表
                  value: dropdown
                - label: 导航栏下方的横向一行
                  value: horizontal
            - $el: div
              attrs:
                style: "margin-top: 0.75rem; padding: 0.75rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.5rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.7;"
              children:
                - $el: p
                  attrs:
                    style: "margin: 0 0 0.25rem; font-weight: 600;"
                  children: 菜单图标
                - $el: p
                  attrs:
                    style: "margin: 0;"
                  children: 在「外观 → 菜单」编辑菜单项的图标字段，填写 Ant Design 图标名称，区分大小写；留空不显示图标。
                - $el: p
                  attrs:
                    style: "margin: 0.35rem 0; overflow-wrap: anywhere;"
                  children:
                    - $el: span
                      children: "示例："
                    - $el: code
                      children: "HomeOutlined · GithubOutlined · HeartTwoTone"
                - $el: a
                  attrs:
                    href: /themes/theme-hanlo/assets/icon/antdv-next/catalog.html
                    target: _blank
                    rel: noopener noreferrer
                    style: "color: inherit; text-decoration: underline; text-underline-offset: 3px;"
                  children: "查看全部 847 个图标 →"
          help: 主菜单内容和层级在「外观 → 菜单」维护；下列开关只控制前台是否显示。
        - $formkit: menuRadio
          name: leftMenu
          if: $get(hanlo_nav_pc_leftMenu).value || $get(hanlo_nav_phone_leftMenu).value
          label: 站点名左侧使用的菜单组
          help: 先在「外观 → 菜单」新建菜单组，再在此选择。桌面左侧入口和手机侧栏共用此选择，留空不显示。
          value: ""
          preserve: true
        - $formkit: group
          name: right
          label: 导航栏右侧功能按钮
          value:
            travelling: true
            article: true
            darkMode: true
            navLogin: false
            console:
              consoleEnable: true
          children:
            - $formkit: switch
              name: travelling
              id: hanlo_nav_travelling
              key: travelling
              label: 显示「开往」入口
              help: 在首页导航右侧显示，点击后随机访问开往项目中的其他网站。
            - $formkit: switch
              name: article
              label: 显示随机文章按钮
              help: 点击后随机打开本站一篇文章，站内需要已有文章。
            - $formkit: switch
              name: darkMode
              label: 显示明暗模式切换按钮
              help: 允许访客手动切换浅色与深色外观；初始模式在「样式」设置中配置。
            - $formkit: switch
              name: navLogin
              label: 显示登录与用户菜单
              help: 未登录时提供登录入口；已登录时显示用户头像（如有）、控制台与退出登录入口。
            - $formkit: group
              name: console
              label: 访客中控台入口
              children:
                - $formkit: switch
                  name: consoleEnable
                  label: 显示中控台按钮
                  help: 在导航栏右侧显示打开访客快捷面板的按钮。
              help: 主题的快捷面板，展示最近评论、标签和归档等内容。
          help: 分别开启访客可用的快捷入口。安装并启用搜索组件插件后，搜索按钮会自动显示。

    - group: top
      label: 首页顶部与背景
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 按页面位置配置首页顶部
            - $el: p
              attrs:
                style: margin:0
              children: 首页依次显示可选的全屏首屏、瞬间条和推荐横幅。首屏背景只覆盖首页第一屏，全站背景位于各页面内容下方，两者独立；关闭模块或切换图片／视频时保留已填内容。
        - $formkit: group
          name: above
          label: 首页全屏首屏
          help: 位于首页最上方，高度为一个屏幕；标题读取 Halo 站点标题，下方可配置轮播文案和背景。
          value:
            enable_above: false
            typed:
            enable_typed_random:
            enable_above_video:
            index_img:
            phone_index_img:
            index_video:
          children:
            - $formkit: switch
              name: enable_above
              key: enable_above
              id: hanlo_top_enable_above
              label: 启用首页全屏首屏
              help: 开启后，访客向下滚动一屏才会看到瞬间条、推荐横幅与文章列表。
            - $formkit: repeater
              name: typed
              if: $get(hanlo_top_enable_above).value
              label: 首屏打字机文案
              value: []
              children:
                - $formkit: text
                  name: text
                  label: 轮播句子
                  placeholder: 记录生活，也分享热爱
                  help: 显示在首屏站点标题下方，建议一句短文。
                  preserve: true
              help: 每项填写一句，按列表顺序循环播放；留空且关闭随机文案时不显示打字机内容。
              addLabel: 添加一句文案
              itemLabels:
                - type: text
                  label: $value.text
              preserve: true
            - $formkit: switch
              label: 追加一言随机文案
              if: $get(hanlo_top_enable_above).value
              name: enable_typed_random
              key: enable_typed_random
              id: hanlo_top_enable_typed_random
              value: false
              help: 从一言（v1.hitokoto.cn）获取一句话及出处，追加到自定义文案后循环播放；请求失败时仅使用自定义文案。
              preserve: true
            - $formkit: switch
              if: $get(hanlo_top_enable_above).value
              label: 首屏使用视频背景
              name: enable_above_video
              key: enable_above_video
              id: hanlo_top_enable_above_video
              value: false
              help: 关闭使用桌面／手机背景图片，开启使用同一段视频。切换后保留另一种素材，但只展示当前模式。
              preserve: true
            - $formkit: attachment
              name: index_video
              key: index_video
              id: hanlo_top_index_video
              if: $get(hanlo_top_enable_above).value  &&  $get(hanlo_top_enable_above_video).value
              label: 首屏背景视频
              width: "15rem"
              aspectRatio: "16/9"
              accepts:
                - "video/*"
              placeholder: https://example.com/media/hero.mp4
              value: ""
              help: 建议使用压缩后的短循环 MP4（H.264），横向 1920×1080（16:9）。桌面和手机共用，静音循环播放并铺满裁切；浏览器可能限制自动播放。
              preserve: true
            - $formkit: attachment
              name: index_img
              if: $get(hanlo_top_enable_above).value  &&  $get(hanlo_top_enable_above_video).value == false
              label: 首屏桌面背景图
              width: "15rem"
              aspectRatio: "16/9"
              placeholder: https://example.com/images/hero-desktop.webp
              value: https://www.dmoe.cc/random.php
              help: 建议 1920×1080（16:9）或更大横图，居中铺满并裁切边缘。站点标题覆盖在中央，主体和文字请留出空间。
              preserve: true
            - $formkit: attachment
              name: phone_index_img
              if: $get(hanlo_top_enable_above).value  &&  $get(hanlo_top_enable_above_video).value == false
              label: 首屏手机背景图
              placeholder: https://example.com/images/hero-mobile.webp
              width: 10rem
              aspectRatio: 9/16
              value: https://imgapi.kouseki.cn/random?sort=mp
              help: 屏幕宽度不超过 768px 时使用，不会自动回退到桌面图。建议 1080×1920（9:16）竖图，主体居中以适应不同屏幕比例。
              preserve: true
        - $formkit: group
          name: global_background
          label: 全站内容背景
          help: 位于页面内容下方，与首页首屏背景独立。背景图片仅在宽于 1300px 的屏幕显示；不会自动把文章卡片变透明。
          value:
            enable_global_background_img: false
            index_background_img:
          children:
            - $formkit: switch
              label: 启用全站背景
              name: enable_global_background_img
              key: enable_global_background_img
              id: hanlo_top_enable_global_background_img
              value: false
              help: 开启后选择图片或视频；关闭后使用主题配色背景。
            - $formkit: switch
              if: $get(hanlo_top_enable_global_background_img).value
              label: 全站背景使用视频
              name: enable_global_background_above_video
              key: enable_global_background_above_video
              id: hanlo_top_enable_global_background_above_video
              value: false
              help: 关闭使用图片，开启使用视频。视频与首屏视频是独立播放器，同时启用会增加加载量。
              preserve: true
            - $formkit: attachment
              name: global_background_img
              key: global_background_img
              id: hanlo_top_global_background_img
              if: $get(hanlo_top_enable_global_background_img).value  &&  $get(hanlo_top_enable_global_background_above_video).value == false
              label: 全站背景图片
              width: "15rem"
              aspectRatio: "16/9"
              placeholder: https://example.com/images/site-background.webp
              help: 建议 1920×1080（16:9）或更大的浅纹理横图，固定铺满并裁切。仅宽于 1300px 时显示，优先选择不干扰正文阅读的图片。
              preserve: true
            - $formkit: attachment
              name: global_background_video
              id: hanlo_top_global_background_video
              key: global_background_video
              if: $get(hanlo_top_enable_global_background_img).value  &&  $get(hanlo_top_enable_global_background_above_video).value
              label: 全站背景视频
              width: "15rem"
              aspectRatio: "16/9"
              placeholder: https://example.com/media/site-background.mp4
              help: 建议短循环 MP4（H.264），1920×1080（16:9），压缩体积以减少加载。静音自动循环播放，浏览器可能限制自动播放。
              preserve: true
        - $formkit: switch
          name: moment
          label: 显示首页瞬间条
          value: true
          help: 在推荐横幅上方滚动显示瞬间内容；需要安装并启用「瞬间」插件，未安装时会显示插件安装提示。
          id: hanlo_top_moment
        - $formkit: group
          name: climb
          label: 瞬间条上的宠物挂件
          help: 需同时开启瞬间条与首页推荐横幅，且屏幕宽于 1200px；点击挂件会移动位置。
          value:
            climbEnable: false
            climbImg: https://imgapi.yyds.pink/random?sort=animals
          children:
            - $formkit: switch
              name: climbEnable
              key: climbEnable
              id: hanlo_top_climbEnable
              label: 显示宠物挂件
              help: 在瞬间条上叠放装饰图片。
              preserve: true
            - $formkit: url
              name: climbImg
              if: $get(hanlo_top_climbEnable).value
              label: 宠物挂件图片地址
              help: 建议透明 PNG／WebP，宽约 540px、比例约 3:1 的横向趴伏插画；前台最大宽度 270px，高度随图片比例变化。
              placeholder: https://example.com/images/pet.webp
              preserve: true
          if: $get(hanlo_top_moment).value && $get(hanlo_top_recentTop).value
          preserve: true
        - $formkit: switch
          name: recentTop
          id: hanlo_top_recentTop
          key: recentTop
          label: 显示首页推荐横幅
          value: true
          help: 在文章列表上方显示左侧介绍与快捷入口、右侧推荐文章；较窄屏幕会简化横幅布局。
        - $formkit: group
          name: BannerLeft
          label: 推荐横幅左侧：介绍与快捷入口
          if: $get(hanlo_top_recentTop).value
          value:
            bannersBackgroundRollStyle: tags-group-all
            bannersBackground: default
            bannersTitleBig: <div class="banners-title-big">Halo Theme</div><div class="banners-title-big">Hao</div>
            bannersTitleSmall: 更多信息请关注 GitHub
            categoryGroup:
              - title: "必看"
                icon: "haofont hao-icon-book"
                url: "/"
                colorOneLight: "#358bff"
                colorTwoLight: "#15c6ff"
                colorOneDark: "#0653b8"
                colorTwoDark: "#2fcbff"
              - title: "热门"
                icon: "haofont hao-icon-fire"
                url: "/"
                colorOneLight: "#ff6655"
                colorTwoLight: "#ffbf37"
                colorOneDark: "#e22a16"
                colorTwoDark: "#da980c"
            techStack:
          children:
            - $formkit: select
              name: bannersBackground
              id: hanlo_top_bannersBackground
              key: bannersBackground
              label: 滚动技术图标来源
              options:
                - label: 主题内置技术图标
                  value: default
                - label: 自定义技术图标
                  value: techStack
              help: 选择主题内置图标或自行添加的图标列表；也会影响「关于」页的技能展示。
              preserve: true
            - $formkit: array
              name: techStack
              if: $get(hanlo_top_bannersBackground).value == 'techStack'
              label: 自定义技术图标列表
              help: 为每项设置名称、图标和底色；用于横幅滚动背景，也供「关于」页技能展示使用。
              value: []
              itemLabels:
                - type: text
                  label: $value.name
                - type: text
                  label: $value.url
              children:
                - $formkit: text
                  name: name
                  label: 技术名称
                  placeholder: TypeScript
                  help: 作为图标悬停提示，并用于关于页技能名称。
                  preserve: true
                - $formkit: attachment
                  name: url
                  label: 技术图标图片
                  placeholder: https://example.com/images/typescript.svg
                  help: 建议 SVG 或 144×144（1:1）的透明 PNG／WebP；横幅图标约以 72px 宽显示。
                  width: 6rem
                  aspectRatio: 1/1
                  preserve: true
                - $formkit: color
                  name: background
                  label: 图标卡片底色
                  help: 选择与图标有足够对比的颜色；用于横幅图标块及关于页技能卡片。
                  preserve: true
              addLabel: 添加技术图标
              preserve: true
            - $formkit: code
              name: bannersTitleBig
              label: 横幅主标题
              placeholder: <div class="banners-title-big">我的数字花园</div>
              height: 80px
              language: html
              help: 支持 HTML；每行建议使用 <div class="banners-title-big">标题文字</div>，以保持大标题样式。
              preserve: true
            - $formkit: code
              name: bannersTitleSmall
              label: 横幅说明文字
              placeholder: 记录开发心得与生活片段
              height: 80px
              language: html
              help: 显示在主标题下方，建议一句简短介绍；支持 HTML，留空不显示。
              preserve: true
            - $formkit: array
              name: categoryGroup
              id: hanlo_top_categoryGroup
              key: categoryGroup
              min: 0
              max: 2
              itemLabels:
                - type: text
                  label: $value.title
                - type: text
                  label: $value.url
              children:
                - $formkit: text
                  name: title
                  label: 入口名称
                  placeholder: 必看精选
                  validation: required
                  value: "必看精选"
                  help: 建议 2～6 个字，作为按钮上的文字。
                  preserve: true
                - $formkit: text
                  name: icon
                  label: 入口图标类名或图片地址
                  placeholder: haofont hao-icon-book
                  validation: required
                  value: "haofont hao-icon-book"
                  help: 填写完整 haofont 图标类名，或以 https:// 开头的图片地址。图片建议 160×160（1:1）透明图；此处不使用导航菜单的 Ant Design 图标名称。
                  preserve: true
                - $formkit: url
                  name: url
                  label: 入口跳转地址
                  placeholder: /categories/notes
                  validation: required
                  value: "/"
                  help: 可用站内路径或完整网址，点击入口后在当前窗口打开。
                  preserve: true
                - $formkit: color
                  name: colorOneLight
                  label: 浅色模式：渐变起点
                  validation: required
                  value: "#358bff"
                  help: 按钮背景从左到右渐变的起始颜色，需与白色文字保持对比。
                  preserve: true
                - $formkit: color
                  name: colorTwoLight
                  label: 浅色模式：渐变终点
                  validation: required
                  value: "#15c6ff"
                  help: 按钮背景从左到右渐变的结束颜色。
                  preserve: true
                - $formkit: color
                  name: colorOneDark
                  label: 深色模式：渐变起点
                  validation: required
                  value: "#0653b8"
                  help: 深色模式下按钮背景左端的颜色，需与白色文字保持对比。
                  preserve: true
                - $formkit: color
                  name: colorTwoDark
                  label: 深色模式：渐变终点
                  validation: required
                  value: "#2fcbff"
                  help: 深色模式下按钮背景右端的颜色。
                  preserve: true
              label: 横幅快捷入口
              help: 最多两个，按列表顺序显示；可链接分类、文章或任意页面，留空不显示入口。
              addLabel: 添加快捷入口
              preserve: true
          help: 宽屏显示标题和技术图标背景，快捷入口随屏幕尺寸调整位置。技术图标配置也被「关于」页的技能展示使用。
          preserve: true
        - $formkit: group
          name: BannerRight
          label: 推荐横幅右侧：文章与专题
          if: $get(hanlo_top_recentTop).value
          value:
            todayRecommend: true
            todayRecommendContent:
              todayRecommendUrl: /
              todayRecommendTitle: Hanlo Theme
              todayRecommendCover: /themes/theme-hanlo/assets/images/home.webp
              todayRecommendxTitle: 今日推荐
            recommendPost: latest
          children:
            - $formkit: switch
              name: todayRecommend
              id: hanlo_top_todayRecommend
              key: todayRecommend
              label: 先显示专题推荐卡片
              help: 在宽屏右侧推荐文章上方覆盖专题卡片；点击卡片跳转，点击「更多推荐」收起卡片。
              preserve: true
            - $formkit: group
              name: todayRecommendContent
              if: $get(hanlo_top_todayRecommend).value
              label: 专题推荐卡片内容
              value:
                todayRecommendUrl:
                todayRecommendTitle:
                todayRecommendCover:
                todayRecommendxTitle:
              children:
                - $formkit: url
                  name: todayRecommendUrl
                  label: 专题跳转地址
                  placeholder: /archives/welcome
                  value: /
                  help: 点击卡片在新窗口打开，可填写站内路径或完整网址。
                  preserve: true
                - $formkit: text
                  name: todayRecommendxTitle
                  label: 专题提示文字
                  placeholder: 本周推荐
                  value: 今日推荐
                  help: 显示在主标题上方，建议 2～6 个字。
                  preserve: true
                - $formkit: text
                  name: todayRecommendTitle
                  label: 专题主标题
                  placeholder: 从这里开始了解我
                  value: Hanlo Theme
                  help: 显示在卡片左下方，建议简短，避免遮挡画面。
                  preserve: true
                - $formkit: attachment
                  name: todayRecommendCover
                  label: 专题封面图片
                  placeholder: https://example.com/images/featured.webp
                  value: /themes/theme-hanlo/assets/images/home.webp
                  width: "15rem"
                  aspectRatio: "16/9"
                  help: 建议 1200×675（16:9）或更大横图，铺满卡片并裁切；左下方放标题，右下方放按钮，避免把关键信息放在这些位置。
                  preserve: true
              help: 配置封面、两级标题和跳转地址；此卡片在宽屏横幅中显示。
              preserve: true
            - $formkit: select
              name: recommendPost
              id: hanlo_top_recommendPost
              key: recommendPost
              label: 推荐文章来源
              value: latest
              options:
                - label: 自动显示最新六篇
                  value: latest
                - label: 手动选择推荐文章
                  value: custom
              help: 自动读取最新六篇文章，或手动选择最多六篇文章并调整顺序。
              preserve: true
            - $formkit: repeater
              if: $get(hanlo_top_recommendPost).value === 'custom'
              name: recommendPostCustom
              label: 手动推荐文章列表
              help: 建议选满六篇以填满宽屏横幅；按列表顺序展示，删除或取消发布文章后请同步更新。
              max: 6
              children:
                - $formkit: postSelect
                  name: post
                  label: 推荐文章
                  value: ""
                  validation: required
                  help: 选择已发布的文章；每项对应横幅中的一张文章卡片。
                  preserve: true
              addLabel: 添加推荐文章
              itemLabels:
                - type: text
                  label: $value.post
              preserve: true
          help: 最多展示六篇推荐文章；宽屏可先覆盖一张专题卡片，访客点击「更多推荐」后查看文章。
          preserve: true

    - group: layout
      label: 文章列表与导航条
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 设置文章入口与卡片排版
            - $el: p
              attrs:
                style: margin:0
              children: 这里控制首页文章列表上方的导航条，以及首页、分类和标签等文章列表的卡片排版。列数在宽屏生效，小屏会按响应式样式排列；每页文章数量请在 Halo 站点设置中调整。
        - $formkit: group
          name: navs
          value:
            nav: category
            navCustomCategory:
            navCustomTag:
            navCustomUrl:
            navMore:
            navMoreCustomUrl:
          children:
            - $formkit: select
              name: nav
              id: hanlo_layout_nav
              key: nav
              label: 导航条内容来源
              options:
                - label: 全部分类
                  value: category
                - label: 全部标签
                  value: tag
                - label: 手动选择分类
                  value: custom-category
                - label: 手动选择标签
                  value: custom-tag
                - label: 自定义链接
                  value: custom-url
              help: 全部分类／标签会自动读取站内数据；手动选择可控制显示范围和顺序；自定义链接可添加任意页面。
            - $formkit: categorySelect
              if: $get(hanlo_layout_nav).value === 'custom-category'
              name: navCategory
              key: navCategory
              label: 导航条分类
              multiple: true
              clearable: true
              searchable: true
              sortable: true
              help: 选择需要显示的分类，可拖动调整顺序；留空时仅保留首页及「更多」入口。
              preserve: true
            - $formkit: tagSelect
              if: $get(hanlo_layout_nav).value === 'custom-tag'
              name: navTag
              key: navTag
              label: 导航条标签
              multiple: true
              clearable: true
              searchable: true
              sortable: true
              help: 选择需要显示的标签，可拖动调整顺序；留空时仅保留首页及「更多」入口。
              preserve: true
            - $formkit: array
              if: $get(hanlo_layout_nav).value === 'custom-url'
              name: navCustomUrl
              key: navCustomUrl
              label: 导航条自定义链接
              value: []
              itemLabels:
                - type: text
                  label: $value.title
                - type: text
                  label: $value.url
              children:
                - $formkit: text
                  name: title
                  label: 链接名称
                  help: 显示在文章导航条中，建议 2～6 个字。
                  placeholder: 文章归档
                  preserve: true
                - $formkit: url
                  name: url
                  label: 链接地址
                  help: 填写站内路径或完整网址，点击后在当前窗口打开。
                  placeholder: /archives
                  preserve: true
              help: 按列表顺序显示，适合添加归档、关于或专题入口。
              addLabel: 添加导航链接
              preserve: true
            - $formkit: select
              name: navMore
              id: hanlo_layout_navMore
              key: navMore
              label: 导航条右侧「更多」入口
              value: categories
              options:
                - label: 隐藏「更多」按钮
                  value: hide
                - label: 分类集合页（/categories）
                  value: categories
                - label: 标签集合页（/tags）
                  value: tags
                - label: 自定义链接
                  value: customUrl
              help: 选择分类集合页、标签集合页或自定义地址；选择隐藏仅移除「更多」按钮。
            - $formkit: url
              if: $get(hanlo_layout_navMore).value === 'customUrl'
              name: navMoreCustomUrl
              label: 「更多」跳转地址
              value:
              help: 填写站内路径或完整网址；仅在「更多」入口选择自定义链接时使用。
              placeholder: /archives
              preserve: true
          label: 首页文章列表上方的导航条
          help: 首页入口始终保留，其余入口可显示分类、标签或自定义链接；右侧「更多」单独设置。
        - $formkit: group
          name: post
          value:
            cols: col2
            postLocation: top
          children:
            - $formkit: select
              name: cols
              label: 宽屏文章列数
              options:
                - label: 单列：突出标题与摘要
                  value: col1
                - label: 两列：封面与文字均衡
                  value: col2
                - label: 三列：紧凑浏览封面
                  value: col3
              help: 屏幕宽度达到 1300px 时使用所选列数；更窄屏幕按主题响应式布局显示。
            - $formkit: select
              name: postLocation
              label: 卡片封面位置
              options:
                - label: 封面在上，文字在下
                  value: top
                - label: 封面在左，文字在右
                  value: left
                - label: 封面在右，文字在左
                  value: right
                - label: 逐篇左右交替
                  value: alternate
              help: 单列建议封面在左、在右或左右交替，多列建议封面在上；手机端会按可用宽度调整排版。
          label: 文章卡片排版
          help: 列数和封面位置共同决定卡片布局；单列适合长标题，多列适合以封面为主的内容。
        - $formkit: url
          name: postRandomImg
          label: 未设置封面时的备用图片
          value: /themes/theme-hanlo/assets/images/home.webp
          help: 文章无封面时使用，推荐横幅也会使用。建议 1200×675（16:9）横图；支持固定图或随机图接口，主题会在地址查询参数后追加文章标题。
          placeholder: https://example.com/images/post-cover.webp
        - $formkit: switch
          name: articleCardPolish
          label: 文章卡片悬停高光
          value: false
          help: 鼠标移入首页、作者页的文章卡片时扫过一道高光；分类和标签页不应用此效果，触屏设备没有常规悬停操作。

    - group: sidebar
      label: 侧栏
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
