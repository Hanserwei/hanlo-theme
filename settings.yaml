              label: 约定开始日期
              preserve: true
              help: 与结束日期一起计算已过去的时间和进度百分比。
            - $formkit: date
              if: $get(hanlo_about_tenyear_tenyear_enable).value
              name: end_time
              label: 约定结束日期
              preserve: true
              help: 应晚于开始日期；如为十年之约，可选择开始日期十年后的同一天。
          help: 独立显示在建站故事下方，按开始和结束日期计算进度。

    - group: comments
      label: 全站评论
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 控制主题中的评论区入口
            - $el: p
              attrs:
                style: margin:0
              children: 主题使用 Halo 评论组件插件。请先安装并启用插件，再检查文章或页面是否允许评论；评论审核、通知和组件样式在 Halo 及插件设置中管理。
        - $formkit: switch
          name: commentsEnable
          id: hanlo_comments_commentsEnable
          key: hanlo_comments_commentsEnable
          label: 显示全站评论区
          value: true
          help: 同时控制主题评论区与直达评论入口；开启后仍需评论组件插件可用，且对应文章或页面允许评论。

    - group: style
      label: 全站外观
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 设置明暗配色与中文转换
            - $el: p
              attrs:
                style: margin:0
              children: 主题色用于链接、按钮和强调色。建议分别检查浅色、深色下的文字对比度；访客可通过已开启的悬浮工具或右键菜单切换外观。
        - $formkit: radio
          name: colorScheme
          label: 页面初始明暗模式
          value: system
          options:
            - label: 跟随系统（记住访客选择）
              value: system
            - label: 固定以深色打开
              value: dark
            - label: 固定以浅色打开
              value: light
          help: 跟随系统时优先记住访客的手动选择，再使用系统偏好；选择固定深色或浅色时，每次打开页面均以该模式开始。
        - $formkit: color
          name: themeLightSkin
          label: 浅色模式强调色
          value: "#425AEF"
          help: "用于浅色模式的链接、按钮和高亮元素。请选择不带透明度的六位十六进制颜色，例如 #425AEF。"
        - $formkit: color
          name: themeDarkSkin
          label: 深色模式强调色
          value: "#f2b94b"
          help: "用于深色模式的链接、按钮和高亮元素。请选择不带透明度的六位十六进制颜色，例如 #F2B94B。"
        - $formkit: switch
          name: universe
          label: 显示深色模式星空粒子
          value: true
          help: 在深色背景上绘制动态星空；效果会增加动画开销，可按设备表现关闭。
        - $formkit: group
          name: translate
          label: 中文简繁转换
          value:
            defaultEncoding: 2
            translateEnable: true
          children:
            - $formkit: radio
              name: defaultEncoding
              label: 网站原文的简繁类型
              options:
                - label: 简体中文
                  value: 2
                - label: 繁體中文
                  value: 1
              help: 选择文章和页面原本使用的简体或繁体，供转换器判断转换方向；不会自动把原文改为该类型。
            - $formkit: switch
              name: translateEnable
              label: 显示简繁切换按钮
              help: 在右下角工具及主题右键菜单中提供切换入口；需至少开启一种对应工具，访客选择会被记住。
          help: 按字表转换页面文字，无法代替多语言内容；原文类型应与网站实际使用的简体或繁体一致。

    - group: code
      label: 文章与评论代码块
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 设置代码高亮和阅读工具
            - $el: p
              attrs:
                style: margin:0
              children: 为正文及主题评论区中可识别的代码块启用 Shiki 高亮。建议在编辑器里标记代码语言；下方工具与配色仅在高亮开启后生效。
        - $formkit: switch
          name: shiki_enable
          id: hanlo_code_shiki_enable
          key: hanlo_code_shiki_enable
          label: 启用代码语法高亮
          help: 为支持的代码块增加语法配色与阅读工具；关闭后保留原始代码内容。
          value: true
        - $formkit: switch
          name: enable_title
          if: $get(hanlo_code_shiki_enable).value
          label: 显示代码标题
          help: 顶部显示语言名称；代码块已有自定义标题时优先显示该标题。
          value: true
          preserve: true
        - $formkit: switch
          name: enable_hr
          if: $get(hanlo_code_shiki_enable).value
          label: 显示工具栏底部分隔线
          help: 在顶部工具栏和代码正文之间加一条分隔线，与标题文字是否显示无关。
          value: true
          preserve: true
        - $formkit: switch
          name: enable_line
          if: $get(hanlo_code_shiki_enable).value
          label: 显示代码行号
          help: 为每行代码添加序号，便于讲解和定位；复制时不包含行号。
          value: true
          preserve: true
        - $formkit: switch
          name: enable_copy
          if: $get(hanlo_code_shiki_enable).value
          label: 显示复制按钮
          help: 点击后复制整个代码块的原始文本，包括当前折叠的内容。
          value: true
          preserve: true
        - $formkit: switch
          name: enable_expander
          if: $get(hanlo_code_shiki_enable).value
          label: 显示整段折叠按钮
          help: 代码初始展开，访客可通过顶部按钮折叠或展开整个代码块。
          value: true
          preserve: true
        - $formkit: switch
          name: enable_height_limit
          id: hanlo_code_enable_height_limit
          key: hanlo_code_enable_height_limit
          if: $get(hanlo_code_shiki_enable).value
          label: 限制长代码的初始高度
          help: 超过指定高度时收起多余内容，并提供“展开完整代码”按钮；与整段折叠按钮独立。
          value: false
          preserve: true
        - $formkit: number
          name: height_limit
          if: $get(hanlo_code_shiki_enable).value && $get(hanlo_code_enable_height_limit).value
          value: 300
          label: 初始可见高度（像素）
          preserve: true
          help: 建议 300–600 像素，仅影响长代码的初始显示区域；如需完整显示，请关闭高度限制。
          placeholder: "300"
          min: 1
          step: 1
        - $formkit: select
          name: theme_light
          if: $get(hanlo_code_shiki_enable).value
          label: 浅色模式代码配色
          value: one-light
          options:
            - value: "one-light"
              label: "One Light"
            - value: "github-light"
              label: "GitHub Light"
            - value: "light-plus"
              label: "Light Plus"
          preserve: true
          help: 跟随页面的浅色模式使用，可选择熟悉的编辑器配色。
        - $formkit: select
          name: theme_dark
          if: $get(hanlo_code_shiki_enable).value
          label: 深色模式代码配色
          value: one-dark-pro
          options:
            - value: "one-dark-pro"
              label: "One Dark Pro"
            - value: "github-dark"
              label: "GitHub Dark"
            - value: "dark-plus"
              label: "Dark Plus"
          preserve: true
          help: 跟随页面的深色模式使用，与全站强调色独立。

    - group: tool
      label: 页面操作工具
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 设置菜单、悬浮按钮与协议提示
            - $el: p
              attrs:
                style: margin:0
              children: 这些工具由主题提供，无需额外工具插件。评论按钮仍依赖评论组件，协议提示的目标页面需自行创建；开启后检查桌面和手机上的按钮占位。
        - $formkit: group
          name: rightMenu
          label: 桌面右键菜单
          value:
            rightMenuEnable: false
          children:
            - $formkit: switch
              name: rightMenuEnable
              label: 启用主题右键菜单
              help: 在桌面右键点击时显示主题菜单，会改变浏览器原有的右键操作入口。
              id: hanlo_tool_rightMenu_rightMenuEnable
          help: 提供返回、刷新、复制和外观切换等常用操作；触摸设备仍按浏览器自身交互使用。
        - $formkit: group
          name: rightside
          label: 右下角悬浮工具
          value:
            rightsideEnable: false
            readmode: false
          children:
            - $formkit: switch
              name: rightsideEnable
              id: hanlo_tool_rightside_rightsideEnable
              label: 显示右下角悬浮工具
              help: 开启后显示悬浮操作按钮；评论入口还需全站评论开关与评论组件插件。
            - $formkit: switch
              name: readmode
              if: $get(hanlo_tool_rightside_rightsideEnable).value
              label: 提供文章阅读模式
              preserve: true
              help: 在文章页工具中显示阅读按钮，进入后隐藏周边区域；不会改变文章内容。
          help: 提供回到顶部、外观切换、侧栏控制等按钮；文章页还可显示目录与阅读模式。
        - $formkit: group
          name: snackbar
          label: 右下角协议提示卡片
          value:
            switch: false
          children:
            - $formkit: switch
              name: switch
              id: hanlo_tool_snackbar_switch
              key: hanlo_tool_snackbar_switch
              label: 显示协议提示卡片
              help: 开启后显示下方标题、说明及链接；这是信息入口，不会管理访客的 Cookie 授权。
            - $formkit: text
              if: $get(hanlo_tool_snackbar_switch).value
              name: introductionTitle
              label: 提示卡片标题
              value: "协议提醒助手"
              preserve: true
              help: 显示在卡片顶部，建议 4–10 个字。
              placeholder: 例如：隐私保护说明
            - $formkit: text
              if: $get(hanlo_tool_snackbar_switch).value
              name: introductionTip
              label: 提示说明
              value: 查看本站为你的个人隐私做出的努力
              preserve: true
              help: 用一句话说明访客可以从链接中了解什么。
              placeholder: 例如：了解本站如何处理你的个人信息
            - $formkit: url
              if: $get(hanlo_tool_snackbar_switch).value
              name: introductionUrl
              value: /privacy
              label: 协议页面地址
              placeholder: https://example.com/privacy
              preserve: true
              help: 先创建对应的隐私政策或使用协议页面，再填写可访问的地址。
            - $formkit: text
              if: $get(hanlo_tool_snackbar_switch).value
              name: introductionName
              value: 本站如何保护你的隐私
              label: 链接悬停提示
              placeholder: 例如：查看隐私政策
              preserve: true
              help: 当前链接显示为箭头图标，此文字用于鼠标悬停说明。
          help: 在页脚区域提供一张协议提示卡片；页面向下滚动时隐藏，目标页面需自行创建。

    - group: other
      label: 资源与页面效果
      formSchema:
        - $el: div
          attrs:
            class: hanlo-settings-guide
            style: "margin: 0 0 1.25rem; padding: 0.85rem 1rem; border: 1px solid rgba(148,163,184,.25); border-radius: 0.65rem; background: rgba(148,163,184,.08); color: inherit; font-size: 0.8125rem; line-height: 1.75;"
          children:
            - $el: p
              attrs:
                style: margin:0 0 .3rem;font-weight:600;color:inherit
              children: 配置资源来源、图片占位和页面提示
            - $el: p
              attrs:
                style: margin:0
              children: 通常保留主题本地资源即可。图片加载、页面入场动画、错误页和首页问候可分别调整；自定义资源来源需与当前主题版本保持一致。
        - $formkit: group
          name: staticResource
          label: 主题静态资源来源
          value:
            use: local
          children:
            - $formkit: select
              name: use
              id: hanlo_other_staticResource_use
              key: hanlo_other_staticResource_use
              label: 资源加载方式
              options:
                - label: 主题安装包中的本地资源
                  value: local
                - label: 自托管资源或 CDN
                  value: custom
              help: 本地方式使用安装包资源；自定义方式需自行托管同版本的完整 assets 目录。
            - $formkit: url
              name: cdn_link
              if: "$get(hanlo_other_staticResource_use).value == 'custom'"
              label: 自托管 assets 根地址
              validation: required
              value: "https://npm.onmicrosoft.cn/hao-theme-static@1.3.7/templates/assets"
              help: 填写以 /assets 结尾且末尾不带斜杠的根地址，目录中须有当前 Hanlo 版本的 css、icon、images 等资源。已有示例为旧版 Hao 资源，切换为自定义前请替换。
              preserve: true
              placeholder: https://cdn.example.com/hanlo/2.3.1/assets
          help: 控制主题图标、部分样式和图片的资源地址；主程序仍由主题本地加载。
        - $formkit: group
          name: opengraph
          label: 列表页社交分享图片
          value:
            image:
          children:
            - $formkit: attachment
              name: image
              label: 全站列表页分享图
              width: "15rem"
              aspectRatio: 1200/630
              help: 建议 1200×630 像素、约 1.91:1，使用公开可访问的完整图片 URL；此项留空时相关页面回退到站点 Logo。
              placeholder: https://example.com/upload/share-cover.jpg
          help: 用于首页、归档、标签等传入全站分享图的页面；文章和单页面使用各自封面，缺少封面时回退到站点 Logo。
        - $formkit: group
          name: vanillaLazyload
          label: 图片延迟加载
          value:
            enable: true
            errorImg: "/themes/theme-hanlo/assets/images/404.gif"
          children:
            - $formkit: switch
              name: enable
              id: hanlo_other_vanillaLazyload_enable
              key: hanlo_other_vanillaLazyload_enable
              label: 启用图片延迟加载
              help: 减少首屏同时请求的图片数量；关闭后对应图片直接加载。
            - $formkit: attachment
              name: errorImg
              label: 延迟加载失败替代图
              validation: required
              width: "15rem"
              aspectRatio: "16/9"
              placeholder: 选择加载失败图或填写图片 URL
              help: 延迟加载的图片失败后使用此图。建议 640×360 像素、16:9，图中文字保持简短。
              if: $get(hanlo_other_vanillaLazyload_enable).value
              preserve: true
          help: 主题中支持延迟加载的图片在接近视口时开始加载；不会统一接管所有背景图和插件图片。
        - $formkit: group
          name: diytitle
          label: 浏览器标签页动态标题
          value:
            diytitleEnable: false
          children:
            - $formkit: switch
              name: diytitleEnable
              id: hanlo_other_diytitle_diytitleEnable
              key: hanlo_other_diytitle_diytitleEnable
              label: 启用标签页标题提示
              help: 只改变浏览器标签上的标题，不改变页面正文或文章标题。
            - $formkit: text
              name: leaveTitle
              if: $get(hanlo_other_diytitle_diytitleEnable).value
              label: 离开标签页时的标题
              value: w(ﾟДﾟ)w 不要走！再看看嘛！
              preserve: true
              help: 切换到其他标签页后显示，可用简短文字提醒访客返回。
              placeholder: 例如：稍后见，记得回来看看
            - $formkit: text
              name: backTitle
              if: $get(hanlo_other_diytitle_diytitleEnable).value
              label: 返回标签页时的标题
              value: ♪(^∇^*)欢迎肥来！
              preserve: true
              help: 访客返回后，将此提示加在原始标题前，约 2 秒后恢复原标题。
              placeholder: 例如：欢迎回来！
          help: 访客切换到其他标签页或返回本站时，短暂替换浏览器标签页标题。
        - $formkit: group
          name: loadingBoxs
          label: 直接或跨站进入时的加载动画
          value:
            loadingBoxEnable: true
            loadingBoxImg: /themes/theme-hanlo/assets/images/hanlo-logo.png
          children:
            - $formkit: switch
              name: loadingBoxEnable
              id: hanlo_other_loadingBoxs_loadingBoxEnable
              key: hanlo_other_loadingBoxs_loadingBoxEnable
              help: 无 referrer 或从其他站点进入时显示；带同源 referrer 的导航、刷新或新标签页不显示。
              label: 显示入场加载动画
            - $formkit: attachment
              name: loadingBoxImg
              if: $get(hanlo_other_loadingBoxs_loadingBoxEnable).value
              label: 入场动画中央图片
              width: "15rem"
              aspectRatio: 1/1
              placeholder: 选择站点 Logo 或填写图片 URL
              preserve: true
              help: 建议 256×256 像素、1:1 的透明 Logo 或轻量动画；留空不展示加载遮罩。
          help: 使用独立的入场遮罩，适用于直接打开本站或从其他站点进入。
        - $formkit: group
          name: error_404
          label: 页面不存在时（404）
          value:
            subtitle: 请尝试站内搜索寻找文章
            background: /themes/theme-hanlo/assets/images/error/404.svg
          children:
            - $formkit: text
              name: subtitle
              label: 404 页面提示
              help: 使用一句话指引访客搜索内容或返回首页。
              placeholder: 例如：页面不见了，试试站内搜索吧
            - $formkit: attachment
              name: background
              width: "15rem"
              aspectRatio: "3/2"
              label: 404 页面插图
              help: 默认使用主题内置的 404 SVG，留空恢复默认。建议使用 3:2、1200×800 像素图片或 SVG；图片居中完整展示，不裁切。
              placeholder: 选择 404 插图或填写图片 URL
          help: 访客打开不存在的地址时展示的提示和插图。
        - $formkit: group
          name: error_500
          label: 服务异常时（500）
          value:
            subtitle: 服务器内部出现错误，请查看日志
            background: /themes/theme-hanlo/assets/images/error/500.svg
          children:
            - $formkit: text
              name: subtitle
              label: 500 页面提示
              help: 建议使用访客能理解的提示，可引导稍后重试。
              placeholder: 例如：服务暂时遇到问题，请稍后重试
            - $formkit: attachment
              name: background
              width: "15rem"
              aspectRatio: "1/1"
              label: 500 页面插图
              help: 默认使用主题内置的 500 SVG，留空恢复默认。建议使用 1:1、800×800 像素图片或 SVG；图片居中完整展示，不裁切。
              placeholder: 选择服务异常插图或填写图片 URL
          help: 服务器渲染错误页时展示的提示和插图；文案用于告知访客当前状态。
        - $formkit: switch
          name: bubbleEnable
          label: 页面横幅气泡动画
          help: 在友链鱼塘、瞬间、待办清单和装备等使用顶部介绍卡片的页面显示上升气泡。
          value: false
        - $formkit: switch
          name: scrollbarLinearGradientEnable
          label: 启用渐变滚动条
          value: false
          help: 在支持自定义滚动条样式的浏览器中显示渐变色，实际外观受浏览器和系统影响。
        - $formkit: switch
          name: tagRandomColorEnable
          label: 标签云使用随机颜色
          value: false
          help: 为侧栏和控制台面板中的标签云分配随机颜色，不影响文章内标签或分类配色。
        - $formkit: group
          name: greeting
          label: 首页按时段问候
          children:
            - $formkit: switch
              name: enable_greeting
              key: hanlo_other_greeting_enable_greeting
              id: hanlo_other_greeting_enable_greeting
              value: false
              label: 显示首页时段问候
              help: 开启后根据下方时间段显示问候语；仅在首页展示。
            - $formkit: array
              name: setting
              if: $get(hanlo_other_greeting_enable_greeting).value
              label: 问候时段列表
              itemLabels:
                - type: text
                  label: $value.greeting
                - type: text
                  label: $value.start_time
                - type: text
                  label: $value.end_time
              value:
                - greeting: 晚安😴
                  start_time: 0
                  end_time: 5
                - greeting: 早上好鸭👋, 祝你一天好心情！
                  start_time: 6
                  end_time: 9
                - greeting: 上午好👋, 状态很好，鼓励一下
                  start_time: 10
                  end_time: 10
                - greeting: 11点多啦, 在坚持一下就吃饭啦～
                  start_time: 11
                  end_time: 11
                - greeting: 午安👋, 宝贝
                  start_time: 12
                  end_time: 14
                - greeting: 🌈充实的一天辛苦啦！
                  start_time: 14
                  end_time: 18
                - greeting: 19点喽, 奖励一顿丰盛的大餐吧🍔。
                  start_time: 19
                  end_time: 19
                - greeting: 晚上好👋, 在属于自己的时间好好放松😌~
                  start_time: 20
                  end_time: 24
              children:
                - $formkit: text
                  name: greeting
                  label: 时段问候语
                  placeholder: 例如：早上好，今天也要元气满满！
                  help: 在对应时间段展示，建议一句简短问候，可使用表情。
                - $formkit: text
                  name: start_time
                  label: 开始小时（0–23）
                  placeholder: "6"
                  help: 填写访客本地时间的整数小时，例如 6 表示 06:00；应不大于结束小时，重叠时前一项优先生效。
                  validation: number|between:0,23
                - $formkit: text
                  name: end_time
                  label: 结束小时（0–24）
                  placeholder: "9"
                  help: 包含该整点所在的一小时；可与开始小时相同，24 表示覆盖至当天结束，不代表次日 0 点。
                  validation: number|between:0,24
              preserve: true
              help: 起止小时都包含在匹配范围内，重叠时优先使用列表中靠前的一项。跨午夜请拆成两项；留空使用内置问候，没有匹配项时显示“晚上好👋”。
              addLabel: 添加问候时段
          help: 按访客设备的本地小时选择一条问候，在进入首页后短暂展示。
