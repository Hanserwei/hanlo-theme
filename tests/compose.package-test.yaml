services:
  halo-package-test:
    image: registry.fit2cloud.com/halo/halo:2.26
    container_name: halo2-theme-package-test
    restart: "no"
    ports:
      - "127.0.0.1:8091:8090"
    environment:
      JVM_OPTS: "-Xms256m -Xmx512m"
      SPRING_THYMELEAF_CACHE: "false"
      TZ: Asia/Shanghai
    command:
      - "--halo.external-url=http://localhost:8091/"
    volumes:
      - halo-package-test-data:/root/.halo2

volumes:
  halo-package-test-data:
    name: halo2-theme-package-test-data
