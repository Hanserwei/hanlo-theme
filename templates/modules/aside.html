<!-- 侧边栏 -->
<th:block th:fragment="aside-widget(widget_data)"
          th:if="${widget_data != null and not #strings.isEmpty(widget_data.widget)}">
    <th:block th:if="${widget_data.widget == 'custom_html'}">
        <th:block th:replace="~{modules/widgets/aside/custom_html :: custom_html(${widget_data})}" />
    </th:block>
    <th:block th:unless="${widget_data.widget == 'custom_html'}">
        <th:block th:replace="~{'modules/widgets/aside/' + ${widget_data.widget}}" />
    </th:block>
</th:block>

<th:block th:fragment="aside-render(widgets, index)"
          th:if="${index < #lists.size(widgets)}"
          th:with="current=${widgets[index]},
                   isStickyStart=${(current != null and current.widget == 'toc') or index == #lists.size(widgets) - 1}">
    <th:block th:if="${isStickyStart}">
        <div class="sticky_layout">
            <th:block th:each="widget_data, iterStat : ${widgets}" th:if="${iterStat.index >= index}">
                <th:block th:replace="~{modules/aside :: aside-widget(${widget_data})}" />
            </th:block>
        </div>
    </th:block>
    <th:block th:unless="${isStickyStart}">
        <th:block th:replace="~{modules/aside :: aside-widget(${current})}" />
        <th:block th:replace="~{modules/aside :: aside-render(${widgets}, ${index + 1})}" />
    </th:block>
</th:block>

<div class="aside-content" id="aside-content" th:fragment="aside(widgets)"
     th:if="${theme.config.sidebar.location != 'hide-aside' && not #lists.isEmpty(widgets)}">
    <th:block th:replace="~{modules/aside :: aside-render(${widgets}, 0)}" />
</div>
