<!-- Keep the saved widget key so existing About page ordering continues to work. -->
<section class="about-emotions" data-about-emotions aria-label="表情互动区"
         th:attr="data-emotions=${theme.config.about?.emotions == null ? '1,2,3,5,22,25,26,28' : #strings.listJoin(theme.config.about.emotions, ',')},
                  data-count=${theme.config.about?.emotion_count ?: 24},
                  data-assets=${assets_link + '/images/tieba'}">
    <div class="about-emotions__header">
        <div>
            <span class="about-emotions__eyebrow">一点快乐</span>
            <h2 class="about-emotions__title">让表情动起来</h2>
        </div>
        <div class="about-emotions__controls" data-emotion-controls hidden>
            <button type="button" data-emotion-shake>摇一摇</button>
            <button type="button" data-emotion-pause aria-pressed="false">暂停</button>
            <button type="button" data-emotion-motion aria-pressed="false" hidden>开启手机感应</button>
        </div>
    </div>
    <p class="about-emotions__hint" data-emotion-status role="status" aria-live="polite">
        抓住表情，拖一拖、甩出去。
    </p>
    <div class="about-emotions__stage" data-emotion-stage>
        <p class="about-emotions__placeholder" data-emotion-placeholder>表情正在入场…</p>
    </div>
    <noscript><p class="about-emotions__hint">启用 JavaScript 后可以体验表情互动。</p></noscript>
</section>
