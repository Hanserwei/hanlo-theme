<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{modules/layouts/layout :: layout(content = ~{::content}, htmlType = 'equipments',title = ${title + ' | ' + site.title}, head = ~{::head},_title = ${title})}">
<th:block th:fragment="head">
    <link th:if="${pluginFinder.available('equipment', '>=2.0.0')}" rel="stylesheet"
          th:href="@{/plugins/equipment/assets/static/equipment.css(v='2.0.0')}">
    <link rel="stylesheet"
          th:href="${assets_link + '/css/equipment-' + theme.spec.version + '.css' + theme_version}">
    <th:block th:replace="~{modules/common/open-graph :: open-graph(_title = ${_title},
                _permalink = '/equipments',
                _cover = ${theme.config.other.opengraph.image},
                _excerpt = ${site.seo.description},
                _type = 'website')}"></th:block>
</th:block>
<th:block th:fragment="content">
    <div class="page" id="body-wrap">

        <!-- 头部导航栏 -->
        <header class="not-top-img" id="page-header">
            <nav th:replace="~{modules/nav :: nav(title = ${_title})}"></nav>
        </header>
        <main class="layout hide-aside" id="content-inner">
            <div id="page">
                <div  th:replace="~{macro/author-content :: author-content(background = ${theme.config.equipment.backgroundImg},
                        smallTitle = ${theme.config.equipment.smallTitle},
                        bigTitle = ${theme.config.equipment.bigTitle},
                        detail = ${theme.config.equipment.detail},
                        buttonUrl = '',
                        buttonTitle = '')}" ></div>
                <div id="equipment" class="hanlo-equipment-content" th:fragment="equipment-content"
                     th:with="equipmentAvailable=${pluginFinder.available('equipment', '>=2.0.0')}">
                    <th:block th:if="${equipmentAvailable}">
                        <th:block th:replace="~{plugin:equipment:modules/equipment :: list(groups=${groups})}"></th:block>
                    </th:block>
                    <p th:unless="${equipmentAvailable}" class="hanlo-equipment-unavailable">
                        装备清单暂时无法展示，请稍后再来看看。
                    </p>
                </div>
            </div>
        </main>
        <!-- 底部 -->
        <footer th:replace="~{modules/footer}"/>
    </div>

</th:block>

</html>
